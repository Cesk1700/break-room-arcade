<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break Room Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column. Lobby = title tiles, who is online, open tables, game shelf.
   Table = code strip, game board, scoreboard. One committed dark world, no light variant. */
:root{
  --ink:#f3f4f7; --panel:#ffffff; --panel2:#eceef3; --well:#e3e6ed; --line:#d2d6df; --text:#1a1e29; --mute:#5b6376;
  --accent:#1f3a5f; --accent-dk:#12253f;
  --coin:#b9810c; --pink:#c2415f; --teal:#1b8f7e; --blue:#3566c9; --violet:#7157bf; --orange:#c75f24;
  --good:#1e8a50; --bad:#c23b3b; --goodbg:#e2f3e9; --badbg:#fbe6e6;
  --display:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:16px/1.45 var(--body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
button,input{font-family:var(--body)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:22px;width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.mute{color:var(--mute)}
.small{font-size:14px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}

/* brand */
.brand{display:flex;flex-direction:column;gap:10px}
h1.title{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tiles{display:none}
.tile{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,68px);line-height:1;width:1.08em;height:1.22em;display:grid;place-items:center;
  border-radius:12px;color:#fff;box-shadow:none;transform:rotate(var(--r,0deg));background:var(--c)}
.tag{max-width:46ch;color:var(--mute);font-size:17px}

/* controls */
.btn{font:700 16px var(--body);border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 2px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s;min-height:46px}
.btn:hover:not(:disabled){background:var(--accent-dk)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input:not([type]){font:600 18px var(--body);background:#fff;color:var(--text);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
input::placeholder{color:#8a91a5}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.err{background:var(--badbg);border:1px solid var(--bad);color:#7a1f1f;border-radius:12px;padding:10px 14px}
.note{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--mute);font-size:14px}

/* profile */
.avatars{display:flex;gap:6px;flex-wrap:wrap}
.avpick{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--well);font-size:24px;cursor:pointer;display:grid;place-items:center}
.avpick[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
.av{font-size:20px;width:34px;height:34px;display:inline-grid;place-items:center;background:var(--well);border-radius:10px;flex:none}

/* lobby */
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:15px}
.person small{color:var(--mute);font-weight:500}
.tables{display:flex;flex-direction:column;gap:10px}
.tbl{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel2);border-left:8px solid var(--c,var(--line));flex-wrap:wrap}
.code{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:22px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.gico{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:none;flex:none}
.gico svg{width:34px;height:34px}
.game h3{font-size:24px;line-height:1.1}
.meta{font-size:13px;color:var(--mute);font-weight:600}
.joinrow{display:flex;gap:10px;flex-wrap:wrap}
.joinrow input{width:9em;text-transform:uppercase;letter-spacing:.14em}

/* table */
.thead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.board{background:var(--panel);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.rhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rn{font-weight:700}
.cat{padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);font-size:13px;font-weight:700}
.secs{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.secs b{font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--well);overflow:hidden;flex:1 0 100%}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.q{font-size:clamp(22px,4vw,32px);line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 17px var(--body);color:var(--text);padding:14px;border-radius:14px;
  border:2px solid var(--line);background:var(--panel2);cursor:pointer;min-height:64px;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .ltr{width:32px;height:32px;border-radius:9px;background:var(--well);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.opt.sel{border-color:var(--c);background:var(--panel2)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.answers{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);font-size:14px;font-weight:600}
.pill.ok{background:var(--goodbg)}
.pill .d{color:var(--good);font-weight:700}
.pill .z{color:var(--mute)}
.bigin{display:flex;gap:10px;flex-wrap:wrap}
.bigin input{flex:1 1 180px;font-size:22px}
.nums{display:flex;gap:12px;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:clamp(38px,9vw,64px);width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:16px;background:var(--c);color:#fff;box-shadow:none}
.ltrs{display:flex;gap:8px;flex-wrap:wrap}
.ltr2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);width:1.3em;height:1.5em;display:grid;place-items:center;border-radius:12px;background:var(--c);color:#fff;box-shadow:none}
.ops{display:flex;gap:8px;flex-wrap:wrap}
.ops button{font:800 20px var(--display);width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.live{min-height:1.5em;font-weight:600}
.live.bad{color:var(--bad)}
.live.good{color:var(--good)}
.reveal{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2)}
.li .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.li .pos{color:var(--good)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{padding:12px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.wcard b{font-family:var(--display);font-size:24px;overflow-wrap:anywhere}
.wcard.match{border-color:var(--good);background:var(--goodbg)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{padding:2px 10px;border-radius:99px;background:var(--panel2);font-size:13px;color:var(--mute)}
.melded{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,56px);color:var(--good)}

/* scoreboard */
.sb{display:flex;flex-direction:column;gap:8px}
.sbrow{display:grid;grid-template-columns:34px minmax(60px,150px) 1fr 70px;gap:10px;align-items:center}
.sbrow.gone{opacity:.45}
.sbrow.me .nm{color:var(--accent)}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:10px;background:var(--well);border-radius:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--c);transition:width .4s}
.pts{text-align:right;font-variant-numeric:tabular-nums}

/* podium */
.podium{display:flex;flex-direction:column;gap:10px}
.pod{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--panel2);border-left:10px solid var(--line)}
.pod.p1{border-left-color:var(--coin);background:#fbf3df}
.pod.p2{border-left-color:#9aa1b5}
.pod.p3{border-left-color:#d9895a}
.pod .place{font-family:var(--display);font-weight:800;font-size:34px;width:1.2em;text-align:center}
.pod .pn{font-weight:700;font-size:20px}
.pod .ps{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#2f5fb3;padding:10px;border-radius:14px;width:min(100%,520px);margin:0 auto}
.col{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.col:disabled{cursor:default}
.col:hover:not(:disabled){background:rgba(255,255,255,.2)}
.cell{aspect-ratio:1;border-radius:50%;background:#e9ecf3;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.cell.R{background:#d6455d}
.cell.Y{background:#f2b705}
.cell.win{outline:4px solid #fff;outline-offset:-4px}
.cell.last{box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.seat{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:700}
.seat.turn{border-color:var(--accent)}
.seat i{width:18px;height:18px;border-radius:50%;display:inline-block}

@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .sbrow{grid-template-columns:34px minmax(40px,90px) 1fr 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== calm professional theme ===== */
:root{
  --ink:#f1f4f3; --panel:#ffffff; --panel2:#eaf0ef; --well:#dde5e3; --line:#cdd8d5; --text:#1d2b2f; --mute:#566a6e;
  --accent:#2f6f6a; --accent-dk:#245853;
  --coin:#a07c3b; --pink:#a5604a; --teal:#4f8a73; --blue:#4f6d9a; --violet:#7d6591; --orange:#a5704a;
  --good:#2e7d5b; --bad:#b04a4a; --goodbg:#e2f1e9; --badbg:#f6e3e1;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.05);
}
h1,h2,h3{font-weight:400;letter-spacing:0}
h1.title{font-size:clamp(40px,7vw,58px);line-height:1.05}
h2{font-size:28px;line-height:1.15}
.game h3,.dcard h3{font-size:25px;line-height:1.1}
.tag{font-size:17px}
.card,.game,.board,.dcard{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}
.game::before{display:none}
.board{border-top:1px solid var(--line)}
.btn{border-radius:10px;box-shadow:none;font-weight:600}
.btn:active:not(:disabled){transform:none;background:var(--accent-dk)}
.btn.ghost{box-shadow:none}
.gico{width:44px;height:44px;border-radius:12px;font-size:19px;font-family:var(--body);font-weight:700}
.gico svg{width:26px;height:26px}
.kicker{font-size:12px;letter-spacing:.1em}
.q{font-size:clamp(24px,4.2vw,34px);line-height:1.2}
.secs,.rn,.pod .place,.pod .ps,.reveal,.melded{font-family:var(--body)}
.reveal,.melded{font-weight:700}
.tbl{border-left-width:6px}
.group{display:flex;flex-direction:column;gap:12px}
.group > h3{font-family:var(--body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dcard{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.dstatus{font-weight:600}
.lb{display:flex;flex-direction:column;gap:6px}
.lbr{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--panel2)}
.lbr.me{background:#d9ebe8;font-weight:700}
.lbn{font-weight:700;color:var(--mute);text-align:center}
.lbname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbres{font-variant-numeric:tabular-nums;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.wgrid{display:flex;flex-direction:column;gap:6px;align-items:center}
.wrow{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.wc{height:56px;border:2px solid var(--line);display:grid;place-items:center;font:700 26px var(--body);background:#fff;border-radius:6px}
.wc.f{border-color:#8a9a9d}
.wc.c{background:#4d8a65;border-color:#4d8a65;color:#fff}
.wc.p{background:#b8902f;border-color:#b8902f;color:#fff}
.wc.a{background:#79868c;border-color:#79868c;color:#fff}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kbr{display:flex;gap:5px;justify-content:center;width:100%}
.key{flex:1 1 0;max-width:42px;height:48px;border-radius:6px;border:0;background:var(--well);color:var(--text);font:700 14px var(--body);cursor:pointer}
.key.wide{max-width:64px;flex:1.6 1 0}
.key.c{background:#4d8a65;color:#fff}.key.p{background:#b8902f;color:#fff}.key.a{background:#79868c;color:#fff}
.flagimg{height:190px;max-width:100%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;align-self:center}
.flagemoji{font-size:110px;line-height:1;align-self:center}
.review{display:flex;flex-direction:column;gap:8px}
.rv{padding:10px 12px;border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.rv.ok{border-left:5px solid var(--good)}.rv.no{border-left:5px solid var(--bad)}
.wdots{display:flex;gap:5px;align-items:center}
.wdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff;display:inline-block}
.wdots i.on{border-color:transparent;background:var(--c)}
@media (max-width:420px){.wrow{grid-template-columns:repeat(5,48px)}.wc{height:48px;font-size:22px}}
.game .btn{margin-top:auto}
.game{height:100%}

/* v3 additions */
.opt.long{align-items:flex-start;min-height:0}
.opt .ocol{display:flex;flex-direction:column;gap:6px}
.opt .why{font-weight:500;font-size:14px;color:var(--mute)}
.opt .why b{color:var(--text)}
.opt .picked{font-style:italic}
.opt.rk3{border-color:var(--good);background:var(--goodbg)}
.opt.rk2{border-color:#9bb8b4}
.opt.rk0{border-color:var(--bad);background:var(--badbg)}
.coach{background:var(--panel2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px}
.li.pit{align-items:flex-start}
.li.pit.win{outline:2px solid var(--accent)}
.ptxt{display:flex;flex-direction:column;gap:2px;font-weight:600}
.ptxt b{font-size:13px;color:var(--mute)}
</style>
</head>

/* ================= helpers ================= */
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));

const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') for (const s in v) e.style.setProperty(s, v[s]);

}

ce to outcome."], ["Match their price on the spot.", 0, "You give away margin and signal your price was inflated."], ["Say the competitor's product is lower quality.", 0, "Attacking competitors without proof erodes trust."], ["Tell them price is not negotiable.", 1, "It closes the conversation."]], "Seek to understand what is being compared before you respond."], ["Objections", "'We need to think about it.' What is the most useful reply?", [["Ask what specifically they want to think through so you can help with it.", 3, "It surfaces the real concern and keeps momentum."], ["Say 'Of course' and wait for them to call.", 1, "Deals rarely revive on their own."], ["Warn them the price goes up at the end of the month.", 0, "False urgency damages trust."], ["Send three follow-up emails in two days.", 0, "Pressure without value is noise."]], "'Think about it' hides a concern. Make it safe to name it."], ["Objections", "The buyer says, 'We tried a tool like yours before and it failed.' What do you do?", [["Ask what happened and what they would need to see differently this time.", 3, "You learn the failure pattern and show you are listening."], ["Say your product is nothing like theirs.", 1, "It dismisses their experience."], ["Skip it and carry on with the demo.", 0, "The unresolved fear will resurface."], ["Blame their previous vendor.", 1, "It could be unfair and reflects poorly on you."]], "Past failures set decision criteria. Mine them."], ["Objections", "'Your solution seems too complicated for our team.' What is the best response?", [["Ask which part feels complex, then show how onboarding and support handle it.", 3, "You diagnose and then address the specific concern."], ["Say it is simple once you get used to it.", 1, "It is dismissive and unspecific."], ["Cut features to simplify the offer.", 1, "You may weaken the deal without understanding the issue."], ["Tell them most customers figure it out.", 0, "It gives no evidence and no reassurance."]], "Respond to specifics with specifics: onboarding plans, references, timelines."], ["Objections", "The prospect says they need to run it by their boss, who has not been in any calls. What is the most effective step?", [["Offer to help prepare a short summary and ask if you can join a brief call with the boss.", 3, "You equip your contact and gain access."], ["Say you will wait until they have the answer.", 1, "You lose influence over the message."], ["Send a long product brochure to the boss.", 0, "Cold materials rarely persuade a decision maker."], ["Push them to sign today without the boss.", 0, "They cannot, and it burns trust."]], "Help your champion sell internally."], ["Objections", "The buyer says 'I'm happy with my current vendor.' Which reply keeps the door open?", [["Ask what they like most and what one thing they would improve if they could.", 3, "It validates and discovers a gap."], ["Say you can offer a better price.", 1, "It makes the conversation about price only."], ["Tell them vendor lock-in is risky.", 0, "It sounds like scare tactics."], ["End the call politely and never contact again.", 1, "You lose future opportunities."]], "Satisfaction is rarely absolute; ask about the one thing they would change."], ["Negotiation", "In the final stage, the buyer asks for a 25 percent discount. What do you do?", [["Ask what is driving the request, then trade concessions for something such as a longer term or faster signature.", 3, "Concessions should always be exchanged for value."], ["Agree to 25 percent to close the deal.", 0, "You give up margin and invite more demands."], ["Refuse flatly and walk away.", 1, "You may lose a good deal needlessly."], ["Offer 10 percent without asking for anything.", 1, "Free concessions teach them to push again."]], "Never concede without a trade."], ["Negotiation", "The buyer says they have another offer lower than yours. What is the best step?", [["Ask to understand the offer, then explain the differences in terms of outcome and risk.", 3, "You compete on value and clarity."], ["Immediately beat their price.", 0, "A race to the bottom."], ["Question whether the other offer even exists.", 0, "It sounds accusatory."], ["Tell them to take it if it is cheaper.", 1, "It may be honest but ends the discussion."]], "Treat competitive offers as information, not as a threat."], ["Negotiation", "You are about to name your price. What is the strongest way to do it?", [["State it with confidence, link it to the outcomes you agreed, then stay silent.", 3, "Confident framing and silence anchor value."], ["Apologise for the price and mention you might be able to adjust.", 0, "You signal that the price is soft."], ["Quickly list discounts before giving the price.", 1, "It makes the price sound inflated."], ["Email the price without context.", 1, "Without context, buyers compare on price alone."]], "Price follows value, and silence after the number is powerful."], ["Negotiation", "A procurement officer demands a lower price in exchange for 'future volume'. How do you respond?", [["Offer tiered pricing that unlocks lower rates when volume is actually reached.", 3, "The promise is turned into a contractual commitment."], ["Give the discount now and trust them.", 0, "Future volume often never arrives."], ["Refuse to discuss it.", 1, "It is rigid."], ["Ask your manager to decide and wait.", 1, "You lose control and time."]], "Tie concessions to commitments you can verify."], ["Negotiation", "At the last moment, the buyer adds new legal demands that delay signature. What is a good approach?", [["Ask which terms matter most, involve your legal team early, and propose a timeline.", 3, "It keeps the process moving and builds trust."], ["Accept every demand to avoid delay.", 1, "It may create risk for your company."], ["Reject them all.", 1, "You may lose the deal over addressable items."], ["Go quiet until they sign.", 0, "Silence is not a strategy."]], "Late-stage legal friction is normal. Manage the path, not just the paper."], ["Negotiation", "The buyer asks for your 'best and final price' on the first call. What is a good reply?", [["Explain that you want to understand their needs first so the price fits the scope.", 3, "It resists premature price-shopping."], ["Give a number to show confidence.", 1, "You have no value anchor yet."], ["Give a large discount to build rapport.", 0, "You devalue the product."], ["Refuse to talk price until they sign.", 1, "It sounds evasive."]], "Pricing before discovery is guessing."], ["Closing", "The buyer is positive but keeps delaying signature. What is the most constructive step?", [["Review the mutual action plan, ask what is still open, and agree a date for the next step.", 3, "It turns vague interest into a dated path."], ["Send a daily reminder email.", 0, "It adds pressure without value."], ["Offer a last-minute discount.", 1, "It rewards delay."], ["Assume they lost interest and close the deal as lost.", 1, "You may abandon a live deal."]], "Always leave a call with a dated, specific next step."], ["Closing", "You are on a call where the buyer says, 'This all sounds good.' What is the best question?", [["What would you need to see to move forward and who else needs to approve it?", 3, "It tests readiness and reveals process."], ["Great, so should I send the contract?", 1, "Too hasty if approvers and criteria are unclear."], ["Fantastic, do you want to sign today?", 1, "It may feel pushy."], ["Thank them and end the call.", 0, "You leave without a next step."]], "Positive tone is not commitment. Confirm criteria and next steps."], ["Prospecting", "You are writing a cold email to a head of operations you have never met. Which opening works best?", [["A one-line observation about their company followed by a relevant question.", 3, "Specific and brief earns attention."], ["A paragraph about your company's history and awards.", 0, "It centres on you rather than them."], ["'I hope this email finds you well, I would love 30 minutes of your time.'", 1, "Generic and gives no reason to reply."], ["A bold claim that you will double their revenue.", 0, "Unproven promises sound like spam."]], "Lead with relevance to them and ask one easy question."], ["Prospecting", "Your first cold call is answered by a gatekeeper who asks, 'What is this regarding?' What do you say?", [["Briefly state the reason, such as helping teams like theirs cut reporting time, and ask who owns that area.", 3, "It is honest and focused on an outcome."], ["Say it is a personal matter.", 0, "Deception destroys trust."], ["Say you would rather speak to the decision maker directly.", 1, "It sounds dismissive."], ["Hang up and call back later pretending to be a client.", 0, "Unethical and risky."]], "Treat gatekeepers as allies, not obstacles."], ["Prospecting", "A prospect has not replied to three emails. What is a good fourth touch?", [["Send a short note with a fresh, relevant insight or case study and an easy yes or no question.", 3, "It adds value and invites a low-effort reply."], ["Send the same email again with 'Just bumping this'.", 1, "No new value."], ["Send an angry email asking why they ignored you.", 0, "It burns the relationship."], ["Stop contacting them forever.", 1, "Persistence with value often works."]], "Each touch should give a reason to respond."], ["Prospecting", "At a conference, you meet someone from your target account. How do you start?", [["Ask what they are working on this year and listen.", 3, "Curiosity builds rapport."], ["Hand over a brochure and your card immediately.", 1, "It reads as transactional."], ["Pitch for ten minutes.", 0, "You lose attention."], ["Ask whether they are the budget holder.", 1, "Too early to qualify."]], "Be interested before being interesting."], ["Follow-up", "After a demo, the buyer goes quiet for two weeks. What is the best follow-up?", [["Reference something they said in the demo, share a relevant resource and propose a quick call.", 3, "It re-engages with relevance."], ["Say, 'Just checking in. Any update?'", 1, "Low value and easy to ignore."], ["Tell them the offer is expiring.", 0, "Artificial urgency damages trust."], ["Call their CEO.", 0, "Going over their head can end the deal."]], "Make follow-ups useful, not needy."], ["Follow-up", "You promised to send a proposal by Friday but it is not ready. What do you do?", [["Tell them proactively, give a new date, and keep it.", 3, "Reliability builds trust."], ["Send a rushed, incomplete proposal.", 1, "A poor first impression is worse than a short delay."], ["Say nothing and hope they forget.", 0, "Broken commitments are remembered."], ["Blame your team.", 0, "It sounds unprofessional."]], "Under-promise, over-deliver, and communicate early."], ["Follow-up", "A deal closed two months ago. What is the best way to keep the relationship strong?", [["Schedule a check-in on their results and share tips for getting more value.", 3, "It supports adoption and uncovers expansion."], ["Only contact them at renewal.", 0, "The relationship will fade."], ["Send marketing newsletters only.", 1, "Impersonal."], ["Ask for a referral in every email.", 1, "It becomes self-serving."]], "The best expansion starts with proven value."], ["Presenting", "Ten minutes into your demo you notice the buyer looking at their phone. What do you do?", [["Pause and ask which part is most relevant, then adapt to their priorities.", 3, "It re-engages by letting them steer."], ["Speed up and finish the full demo.", 1, "You lose them."], ["Ask them to put the phone away.", 0, "It is rude."], ["Continue as planned.", 1, "You ignore warning signs."]], "A demo is a conversation, not a broadcast."], ["Presenting", "You are asked a technical question you cannot answer in front of the client. What is best?", [["Say you will confirm the exact answer, note it down, and follow up the same day.", 3, "Honesty with a commitment builds credibility."], ["Make an educated guess.", 0, "A wrong answer can cost the deal."], ["Change the subject.", 1, "The client will notice."], ["Say it is not important.", 0, "You dismiss their concern."]], "Never bluff, and then keep the follow-up promise."], ["Presenting", "You have 15 minutes to pitch to a senior executive. How do you structure it?", [["Open with their problem and the outcome, show proof, and leave time for questions.", 3, "Executives want relevance and brevity."], ["Cover the company history, then every feature.", 0, "They will tune out."], ["Spend the time on a long demo.", 1, "Detail without context loses attention."], ["Read slides word for word.", 1, "It adds little."]], "Start with the 'so what'."], ["Customer success", "A customer calls angry about a failed delivery. Which first response is best?", [["Listen fully, acknowledge the impact, and state what you will do and by when.", 3, "Empathy plus ownership restores trust."], ["Explain that the delay was caused by the carrier.", 1, "It sounds defensive."], ["Offer a refund without hearing the issue.", 1, "You may miss the real problem."], ["Promise it will never happen again.", 0, "Overpromising creates new risk."]], "Handle the emotion, then the problem."], ["Customer success", "A long-term customer asks to cancel because of budget cuts. What do you do?", [["Ask about their priorities, explore a smaller plan or pause, and keep the door open.", 3, "You protect the relationship and revenue."], ["Process the cancellation immediately.", 1, "You skip a chance to help."], ["Threaten fees under the contract.", 0, "It destroys goodwill."], ["Offer 50 percent off forever.", 0, "You set a precedent that harms margin."]], "Retention starts with understanding their constraints."], ["Email", "Your email subject line should be:", [["Specific and short, such as 'Cutting month-end close time at Acme'.", 3, "Clarity and relevance drive opens."], ["ALL CAPS with exclamation marks.", 0, "It looks like spam."], ["'Quick question'.", 1, "Overused and vague."], ["A full paragraph.", 0, "Too long to read."]], "A subject line is a promise of relevance."], ["Email", "The best call to action at the end of a prospecting email is:", [["One clear, low-effort question, such as 'Is this a priority this quarter?'", 3, "A single easy ask raises replies."], ["Three different asks in one email.", 1, "It creates confusion."], ["'Let me know if you are interested.'", 1, "Vague and easy to ignore."], ["'Call me now'.", 0, "Pushy and unrealistic."]], "Make the next step easy and specific."], ["Ethics", "A customer asks whether your product can do something it cannot yet do. What should you say?", [["Be honest, explain current capabilities, and describe what is realistically on the roadmap, if anything.", 3, "Honesty protects reputation and avoids later disputes."], ["Say yes and hope engineering delivers.", 0, "It sets up a broken promise."], ["Say it is coming soon without knowing.", 0, "A false roadmap commitment."], ["Ignore the question.", 1, "Evasion erodes trust."]], "Sales success compounds on trust."], ["Ethics", "You discover an error in your favour on a customer's invoice. What do you do?", [["Tell the customer and correct it.", 3, "Integrity wins long-term loyalty."], ["Say nothing and keep the extra revenue.", 0, "It risks the relationship and reputation."], ["Wait to see if they notice.", 0, "Passive deception."], ["Offset it quietly on a future invoice without telling them.", 1, "Better than keeping it, but still lacks transparency."]], "Fix errors proactively."], ["Teamwork", "A colleague asks for help preparing a bid, but you are busy with your own deals. What is a good response?", [["Offer a short time block to review their approach and share templates.", 3, "Collaboration lifts the whole team."], ["Say no because quota is individual.", 1, "It weakens the team culture."], ["Take over their bid.", 1, "It undermines their ownership."], ["Ignore the message.", 0, "It damages trust."]], "Great teams share what works."], ["Territory", "Two reps want the same account. What is the best way to resolve it?", [["Discuss with both, check territory rules, and agree on roles with your manager if needed.", 3, "Transparent rules prevent conflict."], ["Contact the customer first to claim it.", 0, "It creates a poor experience."], ["Secretly reassign the contact to yourself.", 0, "It destroys trust."], ["Let the customer choose who they prefer.", 1, "It puts the customer in an awkward position."]], "Customers should never feel internal friction."], ["Mindset", "You lose a deal you expected to win. What is the best next step?", [["Ask the buyer for candid feedback and capture the lessons with your team.", 3, "Losses are data."], ["Blame the competitor's low price.", 1, "It prevents learning."], ["Ignore the loss and move on.", 1, "You miss the opportunity to improve."], ["Argue with the buyer about the decision.", 0, "It harms future chances."]], "Win-loss reviews improve everyone's results."]];

function parseExpr(raw) {

/* ================= Connect Four ================= */
const C4W = 7, C4H = 6;
function c4win(b, p) {
  const at = (r, c) => r >= 0 && r < C4H && c >= 0 && c < C4W ? b[r * C4W + c] : '';
  for (let r = 0; r < C4H; r++) for (let c = 0; c < C4W; c++) {
    if (at(r, c) !== p) continue;
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [r * C4W + c]; let k = 1;
      while (k < 4 && at(r + dr * k, c + dc * k) === p) { cells.push((r + dr * k) * C4W + c + dc * k); k++; }
      if (k === 4) return cells;
    }
  }
  return null;
}

/* ================= Table (one game session) ================= */

      const { row } = submitRow(ctx, 'p' + st.r, 'One or two sentences. Make it count.', (v) => { if (v.trim().length < 3) { document.getElementById('pmsg').textContent = 'Write at least a few words.'; return; } ctx.send({ t: 'w', w: v }); }, { btn: 'Submit pitch', caps: 'sentences' });
      row.querySelector('input').setAttribute('maxlength', '140');
      body = h('div', { class: 'stack' }, row, h('p', { class: 'live bad', id: 'pmsg' }), h('p', { class: 'mute small' }, 'Pitches stay anonymous until voting finishes.'));
    }
  } else {
    const mineV = d.v[me];
    body = h('div', { class: 'stack' }, h('p', { class: 'mute' }, mineV !== undefined ? 'Vote cast. Waiting for the others.' : 'Vote for the best pitch. You cannot vote for your own.'),
      h('div', { class: 'list' }, d.ord.map(k => h('div', { class: 'li pit' + (mineV === k ? ' win' : '') }, h('div', { class: 'ptxt' }, h('span', null, d.w[k])),
        k === me ? h('span', { class: 'mute small' }, 'Your pitch') : h('button', { class: 'btn small', disabled: mineV !== undefined || me < 0, onclick: () => ctx.send({ t: 'v', k }) }, mineV === k ? 'Your vote' : 'Vote')))));
  }
  return h('div', { class: 'stack' }, head, body, who(ctx, i => d.s === 0 ? d.w[i] !== undefined : d.v[i] !== undefined, i => d.g && d.g[i], rev), hostBar(ctx));
};

VIEW.flags = ctx => {
  const { st, d } = ctx, rev = st.ph === 'rev', mine = d.a[ctx.me], cp = d.o.indexOf(0), f = FLAGS[d.f[0]];
  const emoji = String.fromCodePoint(...[...f[0].toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
  const img = h('img', { class: 'flagimg', src: 'https://flagcdn.com/w320/' + f[0] + '.png', alt: 'A national flag to identify' });
  img.addEventListener('error', () => img.replaceWith(h('div', { class: 'flagemoji' }, emoji)));
  return h('div', { class: 'stack' }, rhead(ctx, 'Flags'), h('h2', { class: 'q' }, 'Which country does this flag belong to?'), img,
    h('div', { class: 'opts' }, d.o.map((k, pos) => { const cls = ['opt'];
      if (rev) { if (pos === cp) cls.push('right'); else if (mine && mine[0] === pos) cls.push('wrong'); else cls.push('dim'); } else if (mine && mine[0] === pos) cls.push('sel');
      return h('button', { class: cls.join(' '), disabled: rev || !!mine || ctx.me < 0, onclick: () => ctx.send({ t: 'ans', c: pos }) }, h('span', { class: 'ltr' }, 'ABCD'[pos]), h('span', null, FLAGS[d.f[k]][1])); })),
    who(ctx, i => d.a[i] !== undefined, i => d.g && d.g[i], rev),
    rev ? h('p', { class: 'mute' }, 'This is the flag of ' + f[1] + '.' + (f[4] ? ' ' + f[4] : '')) : (mine ? h('p', { class: 'mute' }, 'Locked in. Waiting for the others.') : null), hostBar(ctx));
};
VIEW.guess = ctx => {
  const { st, d } = ctx, q = G[d.q], rev = st.ph === 'rev', mine = d.a[ctx.me];
  let main;
  if (rev) {
    const ents = Object.keys(d.a).map(k => ({ i: +k, v: d.a[k], e: Math.abs(d.a[k] - q[1]) })).sort((a, b) => a.e - b.e);
    main = h('div', { class: 'stack' }, h('div', null, h('div', { class: 'kicker' }, 'The answer'), h('div', { class: 'reveal' }, fmt(q[1]) + ' ' + q[2])),
      h('div', { class: 'list' }, ents.length ? ents.map(x => h('div', { class: 'li' }, h('span', { class: 'av' }, st.pl[x.i][2]), h('b', null, st.pl[x.i][1]), h('span', { class: 'mute' }, fmt(x.v)), h('span', { class: 'r' }, h('span', { class: 'pos' }, '+' + fmt(d.g[x.i] || 0))))) : h('p', { class: 'mute' }, 'Nobody guessed.')));
  } else if (mine !== undefined) main = h('p', { class: 'live good' }, 'Locked in: ' + fmt(mine) + ' ' + q[2] + '. Waiting for the others.');
  else {
    const { row } = submitRow(ctx, 'g' + st.r, 'Your estimate', (v, inp) => { const n = Number(String(v).replace(/[,\s]/g, '')); if (!isFinite(n) || v.trim() === '') { document.getElementById('gmsg').textContent = 'Type a number, for example 1500.'; return; } ctx.send({ t: 'num', v: n }); }, { mode: 'decimal', btn: 'Lock in' });
    main = h('div', { class: 'stack' }, row, h('p', { class: 'live bad', id: 'gmsg' }));
  }
  return h('div', { class: 'stack' }, rhead(ctx, q[2] ? 'in ' + q[2] : 'a year'), h('h2', { class: 'q' }, q[0]), main,
    who(ctx, i => d.a[i] !== undefined, i => d.g && d.g[i], rev), hostBar(ctx));
};
VIEW.make24 = ctx => {
  const { st, d } = ctx, rev = st.ph === 'rev', solved = d.s[ctx.me], passed = d.p.includes(ctx.me);
  const nums = h('div', { class: 'nums', 'aria-label': 'Numbers to use' }, d.n.map(n => h('span', { class: 'num', style: { '--c': 'var(--coin)' } }, n)));
  let main;
  if (rev) main = h('div', { class: 'stack' }, h('div', null, h('div', { class: 'kicker' }, 'One solution'), h('div', { class: 'reveal' }, (d.sol || '—') + ' = 24')));
  else if (solved) main = h('p', { class: 'live good' }, 'Solved in place ' + solved + ', +' + fmt(d.g[ctx.me]) + ' points. Waiting for the others.');
  else if (passed) main = h('p', { class: 'live' }, 'You passed this round.');
  else {
    const prev = h('p', { class: 'live', id: 'prev' }, '');
    const { inp, row } = submitRow(ctx, 'e' + st.r, 'Your expression', (v) => {
      try { const r = check24(v, d.n); if (r.ok) { ctx.send({ t: 'sub', e: v }); } else { prev.className = 'live bad'; prev.textContent = 'That makes ' + (r.val[1] === 1 ? r.val[0] : r.val[0] + '/' + r.val[1]) + ', not 24.'; } }
      catch (x) { prev.className = 'live bad'; prev.textContent = x.message; }
    }, { btn: 'Check' });
    inp.addEventListener('input', () => { try { const r = parseExpr(inp.value); prev.className = 'live'; prev.textContent = '= ' + (r.val[1] === 1 ? r.val[0] : r.val[0] + '/' + r.val[1]); } catch (x) { prev.className = 'live'; prev.textContent = ''; } });
    const ops = h('div', { class: 'ops' }, ['+', '−', '×', '÷', '(', ')'].map(o => h('button', { type: 'button', 'aria-label': 'Insert ' + o, onmousedown: e => e.preventDefault(), onclick: () => { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + o + inp.value.slice(b); inp.focus(); inp.setSelectionRange(a + 1, a + 1); inp.dispatchEvent(new Event('input')); } }, o)),
      h('button', { class: 'btn ghost small', style: { width: 'auto', fontSize: '14px', fontFamily: 'var(--body)' }, onclick: () => ctx.send({ t: 'pass' }) }, 'Pass'));
    main = h('div', { class: 'stack' }, row, ops, prev);
  }
  return h('div', { class: 'stack' }, rhead(ctx, 'Make 24'), nums, main,
    who(ctx, i => d.s[i] !== undefined || d.p.includes(i), i => d.g[i], rev), hostBar(ctx));
};
VIEW.word = ctx => {
  const { st, d } = ctx, rev = st.ph === 'rev', w = W[d.w], solved = d.s[ctx.me], passed = d.p.includes(ctx.me);
  const ltrs = h('div', { class: 'ltrs', 'aria-label': 'Scrambled letters' }, (rev ? w[0] : d.z).split('').map(c => h('span', { class: 'ltr2', style: { '--c': rev ? 'var(--good)' : 'var(--pink)' } }, c)));
  let main;
  if (rev) main = h('p', { class: 'mute' }, 'The word was ' + w[0] + '.');
  else if (solved) main = h('p', { class: 'live good' }, 'Solved in place ' + solved + ', +' + fmt(d.g[ctx.me]) + ' points. Waiting for the others.');
  else if (passed) main = h('p', { class: 'live' }, 'You passed this round.');
  else {
    const msg = h('p', { class: 'live bad' }, '');
    const { row } = submitRow(ctx, 'w' + st.r, 'Type the word', (v, inp) => { if (v.trim().toUpperCase() === w[0]) ctx.send({ t: 'sub', e: v }); else { msg.textContent = 'Not it. Try again.'; inp.select(); } }, { caps: 'characters' });
    main = h('div', { class: 'stack' }, row, h('p', { class: 'mute', 'data-hint': '1', hidden: ctx.rem() > st.dur / 2 }, 'Hint: it starts with ' + w[0][0] + ' and has ' + w[0].length + ' letters.'), msg,
      h('div', null, h('button', { class: 'btn ghost small', onclick: () => ctx.send({ t: 'pass' }) }, 'Pass')));
  }
  return h('div', { class: 'stack' }, rhead(ctx, w[1]), ltrs, main, who(ctx, i => d.s[i] !== undefined || d.p.includes(i), i => d.g[i], rev), hostBar(ctx));
};
VIEW.meld = ctx => {
  const { st, d } = ctx, rev = st.ph === 'rev', mine = d.w[ctx.me], last = d.h.length ? d.h[d.h.length - 1] : null;
  const prompt = last ? h('div', { class: 'stack' }, h('h2', { class: 'q' }, 'Say a word that connects these'), h('div', { class: 'hist' }, last.map(x => h('span', { style: { fontSize: '20px', color: 'var(--text)', fontWeight: 700 } }, x))))
    : h('h2', { class: 'q' }, 'Type any single word. Do not discuss it yet.');
  let main;
  if (rev) {
    const ws = Object.keys(d.w);
    main = h('div', { class: 'stack' }, d.m ? h('div', { class: 'melded' }, 'Mind meld! Everyone said ' + d.w[ws[0]]) : h('p', { class: 'mute' }, st.r >= st.R ? 'Out of rounds. No meld this time.' : 'Not yet. Next round, aim for the middle.'),
      h('div', { class: 'words' }, ws.map(k => h('div', { class: 'wcard' + (d.m ? ' match' : '') }, h('span', { class: 'small mute' }, st.pl[k][1]), h('b', null, d.w[k])))));
  } else if (mine !== undefined) main = h('p', { class: 'live good' }, 'Locked in: ' + mine + '. Waiting for the others.');
  else { const { row } = submitRow(ctx, 'm' + st.r, 'Your word', v => { if (v.trim()) ctx.send({ t: 'w', w: v }); }, { btn: 'Lock in' }); main = row; }
  const past = d.h.slice(0, -1);
  return h('div', { class: 'stack' }, rhead(ctx, 'Co-op'), prompt, main, who(ctx, i => d.w[i] !== undefined, null, false),
    past.length ? h('div', { class: 'stack' }, h('div', { class: 'kicker' }, 'Earlier rounds'), past.map(r => h('div', { class: 'hist' }, r.map(x => h('span', null, x))))) : null, hostBar(ctx));
};
VIEW.c4 = ctx => {
  const { st, d } = ctx, seatIdx = d.s.indexOf(ctx.me), myTurn = st.ph === 'play' && d.s[d.t] === ctx.me;
  const cols = []; for (let c = 0; c < C4W; c++) { const cells = []; for (let r = 0; r < C4H; r++) { const i = r * C4W + c, ch = d.b[i];
    cells.push(h('div', { class: 'cell' + (ch === 'R' ? ' R' : ch === 'Y' ? ' Y' : '') + (d.wl.includes(i) ? ' win' : '') + (i === d.l ? ' last' : '') })); }
    cols.push(h('button', { class: 'col', disabled: !myTurn, 'aria-label': 'Drop in column ' + (c + 1), onclick: () => ctx.send({ t: 'drop', c }) }, cells)); }
  const seat = k => h('div', { class: 'seat' + (st.ph === 'play' && d.t === k ? ' turn' : '') }, h('i', { style: { background: k ? '#f2b705' : '#d6455d' } }), h('span', { class: 'av' }, st.pl[d.s[k]][2]), st.pl[d.s[k]][1] + (d.s[k] === ctx.me ? ' (you)' : ''));
  let status;
  if (d.w === -1) status = myTurn ? 'Your turn. Pick a column.' : (seatIdx >= 0 ? 'Waiting for ' + st.pl[d.s[d.t]][1] + '.' : 'Watching. ' + st.pl[d.s[d.t]][1] + ' is up.');
  else if (d.w === 2) status = 'Draw. The board is full.';
  else status = st.pl[d.s[d.w]][1] + ' wins' + (d.f ? ' because the other player left.' : '!');
  return h('div', { class: 'stack' }, h('div', { class: 'row' }, seat(0), seat(1)), h('p', { class: 'live ' + (d.w >= 0 && d.w < 2 ? 'good' : ''), 'aria-live': 'polite' }, status), h('div', { class: 'c4' }, cols));
};

function podium(ctx) {
  const { st } = ctx, g = GAMES[st.g], order = st.pl.map((_, i) => i).sort((a, b) => st.sc[b] - st.sc[a]);
  const coop = st.g === 'meld';
  return h('div', { class: 'stack' },
    h('div', { class: 'row' }, h('h2', null, coop ? (st.fin ? 'You melded in ' + st.r + (st.r === 1 ? ' round' : ' rounds') : 'No meld this time') : 'Final scores')),
    h('div', { class: 'podium' }, order.map((i, k) => h('div', { class: 'pod p' + Math.min(k + 1, 4) }, h('span', { class: 'place' }, coop ? '' : k + 1), h('span', { class: 'av' }, st.pl[i][2]), h('span', { class: 'pn' }, st.pl[i][1] + (i === ctx.me ? ' (you)' : '')), h('span', { class: 'ps' }, fmt(st.sc[i]))))));
}

function viewTable(t) {
  const st = t.st;
  const head = h('div', { class: 'thead' }, h('span', { class: 'chip' }, 'Table ', h('span', { class: 'code' }, t.code.toUpperCase())),
    st ? h('span', { class: 'chip', style: { color: GAMES[st.g].color } }, GAMES[st.g].name) : null, h('span', { class: 'grow' }),
    h('button', { class: 'btn ghost small', onclick: () => leaveTable() }, 'Leave table'));
  if (!st) return h('div', { class: 'view' }, head, h('p', { class: 'mute' }, 'Joining table ' + t.code.toUpperCase() + '…'));
  const g = GAMES[st.g];
  const ctx = { t, st, d: st.d || {}, me: t.myIdx(), here: new Set(t.presentIdx()), act: t.presentIdx(), isHost: t.isHost, send: a => t.send(a), rem: () => t.rem() };
  let main;
  if (st.ph === 'lobby') {
    const n = ctx.act.length, ok = n >= g.min;
    main = h('div', { class: 'stack' },
      h('div', { class: 'row' }, gicon(g), h('div', null, h('h2', null, g.name), h('div', { class: 'meta' }, g.mode + ' · ' + g.time))),
      h('p', null, g.rules),
      h('div', { class: 'people' }, ctx.act.map(i => h('span', { class: 'person' }, h('span', { class: 'av' }, st.pl[i][2]), st.pl[i][1], i === ctx.me ? h('small', null, 'you') : null))),
      t.isHost ? h('div', { class: 'row' }, h('button', { class: 'btn', disabled: !ok, onclick: () => ctx.send({ t: 'start' }) }, 'Start game'), ok ? null : h('span', { class: 'mute' }, 'Needs at least ' + g.min + ' players.'))
        : h('p', { class: 'mute' }, 'Waiting for ' + (t.hostName() || 'the host') + ' to start.'),
      h('p', { class: 'small mute' }, 'Colleagues can join from the lobby, or by entering code ' + t.code.toUpperCase() + '.'));
  } else if (st.ph === 'end' && !g.custom) {
    main = h('div', { class: 'stack' }, podium(ctx), endBar(ctx));
  } else {
    main = h('div', { class: 'stack' }, VIEW[st.g](ctx),
      ctx.me < 0 ? h('p', { class: 'note' }, 'You are watching this round. You will be dealt in at the next one.') : null,
      st.ph === 'end' ? endBar(ctx) : null);
  }
  return h('div', { class: 'view' }, head,
    h('section', { class: 'board', style: { '--c': g.color } }, main),
    st.ph !== 'lobby' ? h('section', { class: 'card stack' }, h('div', { class: 'kicker' }, g.custom ? 'Wins' : 'Scores'), scoreboard(ctx)) : null);
}
function endBar(ctx) {
  const { st } = ctx, g = GAMES[st.g], can = ctx.isHost || (g.seatOK && ctx.me >= 0 && g.seatOK(st, ctx.me));
  return h('div', { class: 'row' }, can ? h('button', { class: 'btn', onclick: () => ctx.send({ t: 'again' }) }, g.custom ? 'Rematch, swap colours' : 'Play again') : h('span', { class: 'mute' }, 'Waiting for the host.'),
    ctx.isHost ? h('button', { class: 'btn ghost', onclick: () => ctx.send({ t: 'lobby' }) }, 'Back to table lobby') : null);
}

/* live timers without a full re-render */
function tickBars() {
  const t = S.table; if (!t || !t.st || !t.st.dur) return;
  const rem = t.rem(), pct = Math.max(0, Math.min(100, rem / t.st.dur * 100));
  document.querySelectorAll('[data-bar]').forEach(el => { el.style.width = pct + '%'; });
  document.querySelectorAll('[data-sec]').forEach(el => { el.textContent = Math.ceil(rem / 1000); });
  document.querySelectorAll('[data-hint]').forEach(el => { el.hidden = rem > t.st.dur / 2; });
}
setInterval(() => { tickBars(); tickClocks(); }, 100);

/* ================= boot ================= */
(async function boot() {
  await Net.init();
  Net.root.onPeers(c => {
    S.lobbyPeers = c.peers.filter(p => p.kind !== 'agent');
    if (!S.table) { const sig = JSON.stringify(S.lobbyPeers.map(p => [p.peer, p.presence && p.presence.n, p.presence && p.presence.e, p.presence && p.presence.tb, p.presence && p.presence.ts])); if (sig !== lobbySig) { lobbySig = sig; scheduleRender(); } }
  });
  if (Net.root.onConnection) Net.root.onConnection(() => { lobbySig = ''; scheduleRender(); });
  lobbyPresence();
  fetchBoard('wordle'); fetchBoard('facts');
  render();
  setInterval(() => { if (S.table || Net.mode !== 'live') return; if (S.screen === 'wordle') fetchBoard('wordle'); else if (S.screen === 'facts') fetchBoard('facts'); else { fetchBoard('wordle'); fetchBoard('facts'); } }, 10000);
  const m = /^#table-([a-z0-9]{3,8})$/.exec(location.hash);
  if (m && S.name) joinCode(m[1]);
})();
})();
