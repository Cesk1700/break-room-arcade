<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team 10 Break Room Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' width='512' height='512' role='img' aria-label='Team 10 mark'%3E%3Cg transform='translate(0 0) scale(1.0)'%3E%3Crect width='200' height='200' rx='22' fill='%231DB370'%3E%3C/rect%3E%3Cpolygon points='42,167 70,167 70,80 92,80 56,33 20,80 42,80' fill='%23FFFFFF'%3E%3C/polygon%3E%3Crect x='106' y='58' width='62' height='98' rx='4' fill='none' stroke='%23FFFFFF' stroke-width='22'%3E%3C/rect%3E%3Cline x1='108' y1='154' x2='166' y2='60' stroke='%231DB370' stroke-width='10'%3E%3C/line%3E%3C/g%3E%3C/svg%3E">
<style>
/* Layout: one centred column. Lobby = title tiles, who is online, open tables, game shelf.
   Table = code strip, game board, scoreboard. One committed dark world, no light variant. */
:root{
  --ink:#f3f4f7; --panel:#ffffff; --panel2:#eceef3; --well:#e3e6ed; --line:#d2d6df; --text:#1a1e29; --mute:#5b6376;
  --accent:#1f3a5f; --accent-dk:#12253f;
  --coin:#b9810c; --pink:#c2415f; --teal:#1b8f7e; --blue:#3566c9; --violet:#7157bf; --orange:#c75f24;
  --good:#1e8a50; --bad:#c23b3b; --goodbg:#e2f3e9; --badbg:#fbe6e6;
  --display:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:16px/1.45 var(--body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
button,input{font-family:var(--body)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:22px;width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.mute{color:var(--mute)}
.small{font-size:14px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}

/* brand */
.brand{display:flex;flex-direction:column;gap:10px}
h1.title{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tiles{display:none}
.tile{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,68px);line-height:1;width:1.08em;height:1.22em;display:grid;place-items:center;
  border-radius:12px;color:#fff;box-shadow:none;transform:rotate(var(--r,0deg));background:var(--c)}
.tag{max-width:46ch;color:var(--mute);font-size:17px}

/* controls */
.btn{font:700 16px var(--body);border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 2px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s;min-height:46px}
.btn:hover:not(:disabled){background:var(--accent-dk)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input:not([type]){font:600 18px var(--body);background:#fff;color:var(--text);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
input::placeholder{color:#8a91a5}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.err{background:var(--badbg);border:1px solid var(--bad);color:#7a1f1f;border-radius:12px;padding:10px 14px}
.note{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--mute);font-size:14px}

/* profile */
.avatars{display:flex;gap:6px;flex-wrap:wrap}
.avpick{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--well);font-size:24px;cursor:pointer;display:grid;place-items:center}
.avpick[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
.av{font-size:20px;width:34px;height:34px;display:inline-grid;place-items:center;background:var(--well);border-radius:10px;flex:none}

/* lobby */
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:15px}
.person small{color:var(--mute);font-weight:500}
.tables{display:flex;flex-direction:column;gap:10px}
.tbl{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel2);border-left:8px solid var(--c,var(--line));flex-wrap:wrap}
.code{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:22px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.gico{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:none;flex:none}
.gico svg{width:34px;height:34px}
.game h3{font-size:24px;line-height:1.1}
.meta{font-size:13px;color:var(--mute);font-weight:600}
.joinrow{display:flex;gap:10px;flex-wrap:wrap}
.joinrow input{width:9em;text-transform:uppercase;letter-spacing:.14em}

/* table */
.thead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.board{background:var(--panel);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.rhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rn{font-weight:700}
.cat{padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);font-size:13px;font-weight:700}
.secs{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.secs b{font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--well);overflow:hidden;flex:1 0 100%}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.q{font-size:clamp(22px,4vw,32px);line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 17px var(--body);color:var(--text);padding:14px;border-radius:14px;
  border:2px solid var(--line);background:var(--panel2);cursor:pointer;min-height:64px;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .ltr{width:32px;height:32px;border-radius:9px;background:var(--well);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.opt.sel{border-color:var(--c);background:var(--panel2)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.answers{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);font-size:14px;font-weight:600}
.pill.ok{background:var(--goodbg)}
.pill .d{color:var(--good);font-weight:700}
.pill .z{color:var(--mute)}
.bigin{display:flex;gap:10px;flex-wrap:wrap}
.bigin input{flex:1 1 180px;font-size:22px}
.nums{display:flex;gap:12px;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:clamp(38px,9vw,64px);width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:16px;background:var(--c);color:#fff;box-shadow:none}
.ltrs{display:flex;gap:8px;flex-wrap:wrap}
.ltr2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);width:1.3em;height:1.5em;display:grid;place-items:center;border-radius:12px;background:var(--c);color:#fff;box-shadow:none}
.ops{display:flex;gap:8px;flex-wrap:wrap}
.ops button{font:800 20px var(--display);width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.live{min-height:1.5em;font-weight:600}
.live.bad{color:var(--bad)}
.live.good{color:var(--good)}
.reveal{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2)}
.li .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.li .pos{color:var(--good)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{padding:12px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.wcard b{font-family:var(--display);font-size:24px;overflow-wrap:anywhere}
.wcard.match{border-color:var(--good);background:var(--goodbg)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{padding:2px 10px;border-radius:99px;background:var(--panel2);font-size:13px;color:var(--mute)}
.melded{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,56px);color:var(--good)}

/* scoreboard */
.sb{display:flex;flex-direction:column;gap:8px}
.sbrow{display:grid;grid-template-columns:34px minmax(60px,150px) 1fr 70px;gap:10px;align-items:center}
.sbrow.gone{opacity:.45}
.sbrow.me .nm{color:var(--accent)}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:10px;background:var(--well);border-radius:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--c);transition:width .4s}
.pts{text-align:right;font-variant-numeric:tabular-nums}

/* podium */
.podium{display:flex;flex-direction:column;gap:10px}
.pod{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--panel2);border-left:10px solid var(--line)}
.pod.p1{border-left-color:var(--coin);background:#fbf3df}
.pod.p2{border-left-color:#9aa1b5}
.pod.p3{border-left-color:#d9895a}
.pod .place{font-family:var(--display);font-weight:800;font-size:34px;width:1.2em;text-align:center}
.pod .pn{font-weight:700;font-size:20px}
.pod .ps{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#2f5fb3;padding:10px;border-radius:14px;width:min(100%,520px);margin:0 auto}
.col{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.col:disabled{cursor:default}
.col:hover:not(:disabled){background:rgba(255,255,255,.2)}
.cell{aspect-ratio:1;border-radius:50%;background:#e9ecf3;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.cell.R{background:#d6455d}
.cell.Y{background:#f2b705}
.cell.win{outline:4px solid #fff;outline-offset:-4px}
.cell.last{box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.seat{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:700}
.seat.turn{border-color:var(--accent)}
.seat i{width:18px;height:18px;border-radius:50%;display:inline-block}

@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .sbrow{grid-template-columns:34px minmax(40px,90px) 1fr 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== calm professional theme ===== */
:root{
  --ink:#f1f4f3; --panel:#ffffff; --panel2:#eaf0ef; --well:#dde5e3; --line:#cdd8d5; --text:#1d2b2f; --mute:#566a6e;
  --accent:#2f6f6a; --accent-dk:#245853;
  --coin:#a07c3b; --pink:#a5604a; --teal:#4f8a73; --blue:#4f6d9a; --violet:#7d6591; --orange:#a5704a;
  --good:#2e7d5b; --bad:#b04a4a; --goodbg:#e2f1e9; --badbg:#f6e3e1;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.05);
}
h1,h2,h3{font-weight:400;letter-spacing:0}
h1.title{font-size:clamp(40px,7vw,58px);line-height:1.05}
h2{font-size:28px;line-height:1.15}
.game h3,.dcard h3{font-size:25px;line-height:1.1}
.tag{font-size:17px}
.card,.game,.board,.dcard{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}
.game::before{display:none}
.board{border-top:1px solid var(--line)}
.btn{border-radius:10px;box-shadow:none;font-weight:600}
.btn:active:not(:disabled){transform:none;background:var(--accent-dk)}
.btn.ghost{box-shadow:none}
.gico{width:44px;height:44px;border-radius:12px;font-size:19px;font-family:var(--body);font-weight:700}
.gico svg{width:26px;height:26px}
.kicker{font-size:12px;letter-spacing:.1em}
.q{font-size:clamp(24px,4.2vw,34px);line-height:1.2}
.secs,.rn,.pod .place,.pod .ps,.reveal,.melded{font-family:var(--body)}
.reveal,.melded{font-weight:700}
.tbl{border-left-width:6px}
.group{display:flex;flex-direction:column;gap:12px}
.group > h3{font-family:var(--body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dcard{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.dstatus{font-weight:600}
.lb{display:flex;flex-direction:column;gap:6px}
.lbr{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--panel2)}
.lbr.me{background:#d9ebe8;font-weight:700}
.lbn{font-weight:700;color:var(--mute);text-align:center}
.lbname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbres{font-variant-numeric:tabular-nums;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.wgrid{display:flex;flex-direction:column;gap:6px;align-items:center}
.wrow{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.wc{height:56px;border:2px solid var(--line);display:grid;place-items:center;font:700 26px var(--body);background:#fff;border-radius:6px}
.wc.f{border-color:#8a9a9d}
.wc.c{background:#4d8a65;border-color:#4d8a65;color:#fff}
.wc.p{background:#b8902f;border-color:#b8902f;color:#fff}
.wc.a{background:#79868c;border-color:#79868c;color:#fff}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kbr{display:flex;gap:5px;justify-content:center;width:100%}
.key{flex:1 1 0;max-width:42px;height:48px;border-radius:6px;border:0;background:var(--well);color:var(--text);font:700 14px var(--body);cursor:pointer}
.key.wide{max-width:64px;flex:1.6 1 0}
.key.c{background:#4d8a65;color:#fff}.key.p{background:#b8902f;color:#fff}.key.a{background:#79868c;color:#fff}
.flagimg{height:190px;max-width:100%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;align-self:center}
.flagemoji{font-size:110px;line-height:1;align-self:center}
.review{display:flex;flex-direction:column;gap:8px}
.rv{padding:10px 12px;border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.rv.ok{border-left:5px solid var(--good)}.rv.no{border-left:5px solid var(--bad)}
.wdots{display:flex;gap:5px;align-items:center}
.wdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff;display:inline-block}
.wdots i.on{border-color:transparent;background:var(--c)}
@media (max-width:420px){.wrow{grid-template-columns:repeat(5,48px)}.wc{height:48px;font-size:22px}}
.game .btn{margin-top:auto}
.game{height:100%}

/* v3 additions */
.opt.long{align-items:flex-start;min-height:0}
.opt .ocol{display:flex;flex-direction:column;gap:6px}
.opt .why{font-weight:500;font-size:14px;color:var(--mute)}
.opt .why b{color:var(--text)}
.opt .picked{font-style:italic}
.opt.rk3{border-color:var(--good);background:var(--goodbg)}
.opt.rk2{border-color:#9bb8b4}
.opt.rk0{border-color:var(--bad);background:var(--badbg)}
.coach{background:var(--panel2);border-left:4px solid var(--accent);padding:10px 14px;border-radius:10px}
.li.pit{align-items:flex-start}
.li.pit.win{outline:2px solid var(--accent)}

/* ===== Team 10 brand theme: Team Green, Ledger Green, Charcoal, Cloud, Archivo ===== */
:root{
  --ink:#F3F4F6; --panel:#ffffff; --panel2:#F3F4F6; --well:#E5E7EB; --line:#E1E4E8; --text:#1E2329; --mute:#5B6572;
  --brand:#1DB370; --accent:#12865A; --accent-dk:#0B6B47; --char:#1E2329; --icon:#C4C9D0;
  --coin:#B58A1B; --pink:#C45A52; --teal:#12865A; --blue:#2F6FB5; --violet:#6A5FB0; --orange:#C9742B;
  --good:#12865A; --bad:#C0443F; --goodbg:#E3F5EC; --badbg:#FBEAE8;
  --display:Archivo,'Archivo Brand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:Archivo,'Archivo Brand',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(30,35,41,.05),0 6px 18px rgba(30,35,41,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body{font-family:var(--body);background:var(--ink);position:relative}
#app{position:relative;z-index:1}
/* animated dotted backdrop and drifting line icons, as on the Team 10 site */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background-image:radial-gradient(rgba(30,35,41,.07) 1.2px,transparent 1.3px);background-size:40px 40px;animation:t10grid 8s linear infinite}
#bg svg{position:absolute;stroke:var(--icon);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9;animation:t10drift 16s ease-in-out infinite}
@keyframes t10grid{to{background-position:40px 40px}}
@keyframes t10drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,-20px) rotate(7deg)}}
@media (max-width:1180px){#bg svg{display:none}}
@media (prefers-reduced-motion:reduce){#bg,#bg svg{animation:none}}

h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.01em;color:var(--char)}
h1.title{font-size:clamp(34px,6vw,52px);line-height:1;text-transform:uppercase;letter-spacing:-.015em}
h1.title span{color:var(--accent)}
h2{font-size:24px;font-weight:700}
.game h3,.dcard h3{font-size:20px;font-weight:800;line-height:1.15}
.q{font-weight:700;font-size:clamp(22px,3.8vw,32px);line-height:1.2;letter-spacing:-.01em}
.kicker{letter-spacing:.2em;font-weight:600}
.group > h3{letter-spacing:.22em;font-weight:700;font-size:12px}

/* header with logo */
.t10head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between;padding-bottom:6px}
.t10head .logo{height:46px;width:auto;display:block}
.t10head .logo svg{height:46px;width:auto;display:block}
.t10head .slogan{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#6B7280;font-weight:500}
.brand{display:flex;flex-direction:column;gap:12px}

.btn{background:var(--accent);color:#fff;border-radius:10px;font-weight:700;letter-spacing:.01em;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .15s}
.btn:hover:not(:disabled){background:var(--accent-dk);transform:translateY(-2px);box-shadow:0 10px 22px rgba(29,179,112,.25)}
.btn:active:not(:disabled){transform:translateY(0);background:var(--accent-dk);box-shadow:none}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--char);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){background:#fff;border-color:var(--brand);box-shadow:0 8px 18px rgba(30,35,41,.08)}
:focus-visible{outline:3px solid rgba(29,179,112,.55);outline-offset:2px}
input[type=text],input:not([type]){border:1.5px solid var(--line);border-radius:10px;font-weight:600}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(29,179,112,.18)}
.card,.game,.board,.dcard{border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);background:#fff}
.game{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.game:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 14px 30px rgba(30,35,41,.09)}
.dcard{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.dcard:hover{transform:translateY(-2px)}
.gico{border-radius:12px}
.lbr.me{background:var(--goodbg)}
.opt{border-radius:12px;border:1.5px solid var(--line);background:#fff;transition:border-color .15s,background .15s,transform .15s var(--ease),opacity .25s}
.opt:hover:not(:disabled){transform:translateY(-1px);border-color:var(--brand)}
.opt.sel{background:var(--goodbg);border-color:var(--brand)}
.opt .ltr{background:var(--panel2);font-family:var(--body);font-weight:800;color:var(--char)}
.opt.right{border-color:var(--brand);background:var(--goodbg)}
.pill,.person{background:#fff;border:1px solid var(--line)}
.cat{background:var(--goodbg);color:var(--accent-dk);font-weight:700}
.coach{border-left-color:var(--brand)}
.thead .code{font-family:var(--display);font-weight:800;letter-spacing:.14em}

/* smooth transitions between views and rounds */
.enter{animation:enter .35s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opts .opt{animation:pop .3s var(--ease) both}
.opts .opt:nth-child(2){animation-delay:.04s}.opts .opt:nth-child(3){animation-delay:.08s}.opts .opt:nth-child(4){animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar>i,.bar span{transition:width .3s linear}
@media (prefers-reduced-motion:reduce){.enter,.opts .opt{animation:none}.game:hover,.btn:hover{transform:none}}

/* connection banner */
.conn{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mute)}
.conn .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--well);border-top-color:var(--brand);animation:t10spin .9s linear infinite;flex:none}
@keyframes t10spin{to{transform:rotate(360deg)}}

/* hints (Where Am I) and capitals */
.hints{display:flex;flex-direction:column;gap:8px}
.hint{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);animation:pop .35s var(--ease) both}
.hint .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--goodbg);color:var(--accent-dk);display:grid;place-items:center;font-weight:800;font-size:13px}
.hint.locked{background:var(--panel2);border-style:dashed;color:var(--mute);animation:none}
.hint.locked .n{background:var(--well);color:var(--mute)}
.worth{display:flex;gap:10px;align-items:baseline}
.worth b{font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.cap-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cap-flag{height:64px;width:auto;border-radius:6px;border:1px solid var(--line);box-shadow:var(--shadow)}
.cap-name{font-size:clamp(26px,5vw,40px);font-weight:800;letter-spacing:-.015em;line-height:1.05}
.guessrow{display:flex;gap:10px;flex-wrap:wrap}
.guessrow input{flex:1;min-width:200px}
.tries{display:flex;gap:6px}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--well);display:block}
.tries i.used{background:var(--bad)}

  background:#fff;cursor:pointer;transition:opacity .55s ease,transform .55s cubic-bezier(.4,0,.2,1);font-family:"Archivo","Archivo Brand",system-ui,sans-serif;color:#1E2329}

#splash.sp-out{opacity:0;transform:scale(1.025);pointer-events:none}

.sp-logo{width:min(82vw,600px);height:auto;display:block;overflow:visible}
.sp-skip{position:absolute!important;top:16px;right:18px;z-index:2;border:0;background:transparent;color:#5B6572;font:600 12px "Archivo","Archivo Brand",sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:10px 12px;border-radius:8px;cursor:pointer;opacity:0;animation:spFade .5s 1s forwards}
.sp-skip:hover,.sp-skip:focus-visible{color:#12865A;background:rgba(29,179,112,.1);outline:none}
.sp-tile{transform-box:fill-box;transform-origin:center;animation:spTile .8s cubic-bezier(.2,1.25,.3,1) both}
.sp-arrow{transform-box:fill-box;transform-origin:50% 100%;animation:spArrow .7s .35s cubic-bezier(.2,.9,.25,1) both}
.sp-zero{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw .8s .65s cubic-bezier(.5,0,.2,1) forwards}

.sp-l{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:spLetter .65s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(1.05s + var(--i)*.09s)}
.sp-n{transform-box:fill-box;transform-origin:50% 60%;opacity:0;animation:spPop .7s cubic-bezier(.2,1.3,.3,1) forwards;animation-delay:calc(1.5s + var(--i)*.12s)}
.sp-slogan{font-size:clamp(11px,1.5vw,14px);letter-spacing:.42em;text-transform:uppercase;color:#6B7280;font-weight:500;margin:-6px 0 0;opacity:0;animation:spRise .7s 2s cubic-bezier(.2,.8,.2,1) forwards}
.sp-quote{max-width:min(760px,92vw);opacity:0;animation:spRise .9s 2.4s cubic-bezier(.2,.8,.2,1) forwards}
.sp-kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#12865A;margin-bottom:14px}
.sp-kicker::before,.sp-kicker::after{content:"";width:28px;height:2px;background:#1DB370;border-radius:2px;opacity:.7}
.sp-quote blockquote{margin:0;font-size:clamp(21px,3.6vw,32px);line-height:1.28;font-weight:600;letter-spacing:-.012em;color:#1E2329;text-wrap:balance}
.sp-quote blockquote::before{content:"\201C";display:block;font-size:64px;line-height:.55;height:30px;color:#1DB370;font-weight:800}
.sp-go{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:#12865A;color:#fff;font:700 16px "Archivo","Archivo Brand",sans-serif;padding:14px 30px;cursor:pointer;
  box-shadow:0 10px 24px -10px rgba(18,134,90,.65);opacity:0;animation:spRise .7s 3.1s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .2s,background .2s,box-shadow .2s}
.sp-go:hover,.sp-go:focus-visible{background:#0B6B47;transform:translateY(-2px);box-shadow:0 14px 28px -12px rgba(18,134,90,.8);outline:none}
.sp-go i{font-style:normal;transition:transform .2s}.sp-go:hover i{transform:translateX(4px)}
.sp-bar{position:absolute!important;left:0;right:0;bottom:0;height:3px;background:rgba(29,179,112,.12);opacity:0;animation:spFade .4s 3.1s forwards}
.sp-bar i{display:block;height:100%;width:100%;background:#1DB370;transform-origin:left;transform:scaleX(0);animation:spBar 11s 3.2s linear forwards}
@keyframes spTile{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes spArrow{0%{transform:translateY(46px) scaleY(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spLetter{0%{transform:translateY(34px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spPop{0%{transform:scale(.4) translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spRise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spFade{to{opacity:1}}
@keyframes spGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1}100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}}

@media (prefers-reduced-motion:reduce){#splash *,#splash::after{animation-duration:.01s!important;animation-delay:0s!important}.sp-bar{display:none}}
@media (max-height:560px){.sp-quote blockquote::before{display:none}.sp-kicker{margin-bottom:8px}}
.qotd{margin:2px 0 0;padding:10px 14px;border-left:3px solid var(--brand);background:rgba(29,179,112,.07);border-radius:0 10px 10px 0;font-size:14px;line-height:1.45;color:var(--char);font-weight:500}
.qotd b{color:var(--accent);font-weight:700;letter-spacing:.02em;margin-right:4px}
</style>
</head>

  var Q = ["Every deal begins as a stranger's question you took the time to understand.", "Listen until you can say their problem better than they can.", "The first yes is rarely about the product. It is about trust.", "Curiosity closes more deals than clever pitches ever will.", "A good question is worth more than a great slide.", "People buy outcomes. Sell the Monday morning after the contract is signed.", "Pick up the phone. Inboxes are crowded, voices are not.", "Your pipeline is a garden. Water it before you are hungry.", "A small follow-up today beats a heroic one next month.", "Silence after a good question is not awkward. It is where the real answer lives.", "Be the colleague your customer is glad to see in the calendar.", "Prepare like it is a first meeting, even if it is the tenth.", "The best pitch is a customer who tells the story for you.", "Do not chase the signature. Chase the clarity.", "Every no moves you closer to the right yes.", "Know the customer's business well enough to be useful before you are paid.", "Your reputation travels faster than your proposal.", "Say less about features, and more about what changes for them.", "Ask what happens if they do nothing. That is where urgency hides.", "A warm introduction is a loan of someone else's credibility. Repay it generously.", "Be early, be curious, be kind. In any language, it works.", "Selling is helping with a deadline.", "Numbers persuade the head. Stories move the budget.", "A customer who feels heard rarely needs to be convinced.", "Take notes by hand. It tells people they matter.", "The goal of discovery is not to find a fit. It is to find the truth.", "If you are talking more than half the call, you are presenting, not selling.", "Make the next step so clear that saying yes feels easy.", "Do the thing you said you would do. Then do it a day early.", "Every great account started with a tiny, well-handled first request.", "Respect their time and they will give you more of it.", "A clear no is sting.", "The longest sales cycles are shortened by one honest conversation.", "Say thank you in writing. Almost nobody does.", "Do not oversell. Under-promise, then delight.", "Behind every budget line is a person with something to prove. Help them prove it.", "Ask permission to go deeper. It is amazing how often the answer is yes.", "Win the room by understanding the people who are not in it.", "Sell the first step, not the whole journey.", "The most valuable skill in sales is staying curious when you would rather be right.", "Let them finish their sentence. The best part often comes last.", "A customer's silence is data. Follow up kindly and find out what it means.", "Keep your promises small and your delivery large.", "Success is a calendar full of conversations you prepared for.", "If you are not sure what to say, ask a better question.", "Make it easy to buy and a pleasure to be a customer.", "The right customer makes the whole team better.", "Meet people where they are, in language, culture and timing.", "Today's patience is tomorrow's partnership.", "Show your work. Customers trust what they can follow.", "Competence is quiet. It shows up on time and does the follow-up.", "There is no such thing as a cold lead. Only an unfinished conversation.", "Share what you know, ask what you do not, and own what you promise.", "Do not wait for the perfect moment to reach out. Reach out and make the moment good.", "A short, specific email beats a long, polished one every time.", "Take the objection seriously. It means they are still thinking about buying.", "Every call is a rehearsal for a better one tomorrow.", "The price is only high when the value is unclear.", "Learn how your customer says thank you, and how they say no.", "Enthusiasm opens the door. Preparation keeps you in the room.", "In sales, the fortune is in the follow-up.", "Make one more thoughtful call than feels necessary.", "Be so clear about your customer's problem that the solution feels obvious.", "A g const SALQ = [["Sales", "In the SPIN selling framework, what does the 'I' stand for?", "Implication", "Interest", "Inquiry", "Incentive", "Implication questions explore the consequences of a problem so the buyer feels its weight."], ["Sales", "In the MEDDIC qualification framework, what does the first 'M' stand for?", "Metrics", "Meeting", "Market", "Money", "Metrics are the quantifiable value the buyer expects from the solution."], ["Sales", "In MEDDIC, which letter refers to the person who has the budget authority and cares most about the outcome?", "Economic Buyer", "Champion", "Decision Criteria", "Identify Pain", "The Champion is the internal advocate; the Economic Buyer holds the budget."], ["Sales", "What does BANT stand for?", "Budget, Authority, Need, Timeline", "Buyer, Approval, Negotiation, Terms", "Budget, Approval, Next steps, Targets", "Brand, Audience, Needs, Trust", "It is a classic lead qualification checklist introduced by IBM."], ["Sales", "Which book introduced the idea that top reps teach, tailor and take control of the sale?", "The Challenger Sale", "Never Split the Difference", "Predictable Revenue", "To Sell Is Human", "It was based on research of thousands of B2B reps."], ["Sales", "What is 'ARR' in subscription businesses?", "Annual Recurring Revenue", "Average Retention Rate", "Account Renewal Ratio", "Aggregate Revenue Return", "It normalises recurring contracts to a yearly figure."], ["Sales", "If a customer churns, what has happened?", "They have stopped buying or cancelled", "They have upgraded", "They have referred a new customer", "They have asked for a discount", "Churn is the counterpart of retention."], ["Sales", "What is a 'champion' in a B2B deal?", "An internal supporter who advocates for you", "The CEO of the buyer", "Your top-performing rep", "A competitor's partner", "Deals without a champion tend to stall."], ["Sales", "What does 'discovery' mean in a sales conversation?", "Learning the buyer's situation, problems and goals", "Presenting a product demo", "Negotiating the price", "Sending the contract", "Strong discovery usually decides whether the demo lands."], ["Sales", "Which closing approach is built on asking questions the buyer answers 'No' to, per Chris Voss's Never Split the Difference?", "No-oriented questions", "Assumptive close", "Alternative close", "Puppy-dog close", "They let buyers feel safe and in control."], ["Sales", "What is an 'assumptive close'?", "Proceeding as though the buyer has already decided", "Asking for a discount", "Ending the call early", "Offering a free trial", "Used well it keeps momentum; used poorly it feels pushy."], ["Sales", "What is 'mirroring' in negotiation?", "Repeating the last few words the other person said", "Copying their body language only", "Matching their price", "Using their company logo", "It prompts the other side to elaborate."], ["Sales", "What does 'CAC' stand for?", "Customer Acquisition Cost", "Contract Approval Cycle", "Closed Account Count", "Cost After Commission", "It is usually compared with the customer's lifetime value."], ["Sales", "What does LTV (lifetime value) represent?", "The total revenue or margin expected from a customer relationship", "The cost of acquiring a customer", "The length of the sales cycle", "The number of leads per month", "LTV to CAC of around 3 to 1 is a common benchmark."], ["Sales", "What is a 'pipeline coverage ratio' of 3x?", "Pipeline value equals three times the target", "The rep has three deals", "Three calls per lead", "Three competitors per deal", "Teams use it to judge if there is enough pipeline to hit quota."], ["Sales", "What is 'upselling'?", "Selling a higher-tier or upgraded version to an existing customer", "Selling to a new market", "Lowering the price for volume", "Selling through partners", "Cross-selling adds different products."], ["Sales", "What is the main purpose of a 'mutual action plan'?", "A shared timeline of steps both sides agree to before signing", "A discount schedule", "An internal forecast", "A marketing calendar", "It exposes risks early and keeps both parties accountable."], ["Sales", "What is the term for the fear-based objection 'We have always done it this way'?", "Status quo bias", "Anchoring", "Scarcity", "Reciprocity", "Your biggest competitor is often doing nothing."], ["Sales", "What does the 'anchoring' effect mean in pricing?", "The first number mentioned strongly influences later judgments", "Fixing a price for a year", "Offering a money-back guarantee", "Lowering the price to win", "Negotiators often make the first offer to set an anchor."], ["Sales", "Which of these is the best response to 'Your price is too high'?", "Ask what they are comparing it with and what the value gap is", "Immediately offer a discount", "Insist the price is fair", "Say you will check with your manager", "Understanding the comparison reveals the real objection."], ["Sales", "What is a 'BATNA' in negotiation?", "Best Alternative To a Negotiated Agreement", "Basic Agreement To Negotiate Again", "Buyer's Approved Terms and Numbers", "Best Available Tactical Negotiation Approach", "Your BATNA sets your walk-away point."], ["Sales", "What does 'ICP' stand for in sales and marketing?", "Ideal Customer Profile", "Initial Contact Process", "Internal Contract Policy", "Integrated Close Plan", "It describes the type of company where you win most often."], ["Sales", "What is 'sandbagging' a deal?", "Deliberately holding back a deal from the forecast to close it later", "Adding extra discounts", "Over-promising features", "Closing early", "Reps may do it to look good next quarter."], ["Sales", "What is 'multi-threading' in enterprise sales?", "Building relationships with several stakeholders in the account", "Running several deals at once", "Calling in different time zones", "Using multiple email accounts", "Single-threaded deals die when the contact leaves."], ["Sales", "Which question is an open question?", "What is driving this project now?", "Do you have a budget?", "Is Tuesday good for you?", "Are you the decision maker?", "Open questions start with what, how or why and invite explanation."], ["Sales", "What does NPS measure?", "Customer willingness to recommend you", "Net profit per sale", "Number of prospects served", "Negotiated price spread", "It asks a single 0 to 10 likelihood-to-recommend question."], ["Sales", "In pricing, what is a 'decoy' option?", "An inferior option that makes another option look better", "A free trial", "A price match", "A bundled discount", "It is often used to nudge buyers toward the mid-tier plan."], ["Sales", "What is the 'Rule of Reciprocity' as applied in sales?", "People feel obliged to return favours", "People buy when prices drop", "People trust big brands", "People prefer round numbers", "It underlies why giving value first can help."], ["Sales", "What is the sales concept of 'social proof'?", "People follow the choices of others like them", "Posting on social media", "Offering referral bonuses", "Using testimonials only from executives", "Case studies and customer references are common forms."], ["Sales", "What should a good follow-up email after a discovery call include?", "A recap of their goals, agreed next steps and a date", "A long product brochure", "Only a thank you", "An immediate discount", "It keeps the buyer's own words at the centre."], ["Sales", "What is the term for the length of time from first contact to closing a deal?", "Sales cycle", "Buying window", "Funnel loop", "Pipeline age", "Shorter cycles improve cash flow and forecast accuracy."], ["Sales", "What is a 'trial close'?", "A question that tests the buyer's readiness before the final ask", "A free trial of the product", "A practice presentation", "A late-stage discount", "It helps you gauge where the buyer stands."], ["Sales", "What does 'win rate' measure?", "Percentage of qualified opportunities that become closed-won", "Number of calls made", "Average deal size", "Quota attainment", "It is often tracked by stage and by source."], ["Sales", "When a buyer says 'Send me some information', what is usually the best next step?", "Ask what specifically they want to learn and agree a follow-up time", "Send the full brochure immediately", "Wait for them to call", "Offer a discount", "It turns a brush-off into a next step."]];

const SCEN = [["Discovery", "You open a first call with a new prospect, a mid-sized logistics firm. They say, 'We're just exploring options.' What do you do?", [["Ask what prompted them to start exploring now and what would make it a success.", 3, "It uncovers urgency and the outcome they want."], ["Walk through your top five features so they have a full picture.", 1, "You are pitching before you understand anything."], ["Offer a limited-time discount to keep them engaged.", 0, "Discounting before value is established trains buyers to wait."], ["Say you will send over a deck and follow up next week.", 1, "It is polite but gives up the chance to learn why they are looking."]], "Strong discovery starts with the trigger event: why now, and what changes if nothing happens."], ["Discovery", "The buyer says their current process 'works fine'. What is your best move?", [["Ask where it breaks down when volume spikes or someone is away.", 3, "It surfaces hidden costs without attacking their process."], ["Tell them competitors have already moved on from that approach.", 0, "It creates defensiveness and is unproven."], ["Agree and ask to stay in touch.", 1, "You may lose a deal where a quiet pain exists."], ["Show a demo of how much better your product is.", 1, "Without pain, a demo is only a feature tour."]], "Status quo is the biggest competitor. Gently explore the gap between how things work and how they could."], ["Discovery", "You learn the contact is a team lead, not the budget holder. What next?", [["Ask how decisions like this are made and who else would care about the outcome.", 3, "It maps the buying group without bypassing your contact."], ["Ask to be introduced to the CFO immediately.", 1, "Too early; you have not earned the introduction."], ["Continue and assume the lead will sort out budget.", 1, "Hope is not a plan."], ["Email the CFO directly behind the lead's back.", 0, "It damages trust with your only ally."]], "Find the process, then recruit your contact as a coach."], ["Discovery", "A prospect says, 'We have no budget this year.' How do you respond?", [["Ask how they usually fund projects that deliver savings or revenue, and what it costs them to wait.", 3, "It reframes budget as a prioritisation question."], ["Offer a steep discount to fit their numbers.", 0, "You are paying to be heard and still may not close."], ["Accept it and close the opportunity.", 1, "You gave up without testing the objection."], ["Say budget can always be found if they really want it.", 1, "It sounds like pressure with no insight."]], "'No budget' often means 'not a priority yet'. Quantify the cost of inaction."], ["Discovery", "Halfway through discovery you realise the prospect is a poor fit for your product. What do you do?", [["Be honest, explain why, and suggest what might suit them better.", 3, "Honesty builds reputation and referrals."], ["Keep selling; a closed deal is a closed deal.", 0, "Bad-fit customers churn and complain."], ["Stall and hope they stop replying.", 1, "It wastes both sides' time."], ["Offer a heavy discount to make it work.", 0, "It prices in a problem you cannot fix."]], "Qualifying out quickly is a skill; it protects pipeline quality and your credibility."], ["Discovery", "You ask, 'What keeps you up at night about this area?' and they give a vague answer. What is the best follow-up?", [["Ask for a recent example of when it went wrong.", 3, "Specific stories reveal real impact."], ["Move on to the next question on your list.", 1, "You miss the opening."], ["Offer your own list of typical problems.", 1, "It puts words in their mouth."], ["Tell them it must be something serious.", 0, "It sounds manipulative."]], "Ask for stories, not summaries. Detail reveals cost, people and timing."], ["Objections", "The buyer says, 'Your competitor is 20 percent cheaper.' What is your best response?", [["Ask what they value most and where they see differences, then tie your value to those.", 3, "It moves the conversation from price to outcome."], ["Match their price on the spot.", 0, "You give away margin and signal your price was inflated."], ["Say the competitor's product is lower quality.", 0, "Attacking competitors without proof erodes trust."], ["Tell them price is not negotiable.", 1, "It closes the conversation."]], "Seek to understand what is being compared before you respond."], ["Objections", "'We need to think about it.' What is the most useful reply?", [["Ask what specifically they want to think through so you can help with it.", 3, "It surfaces the real concern and keeps momentum."], ["Say 'Of course' and wait for them to call.", 1, "Deals rarely revive on their own."], ["Warn them the price goes up at the end of the month.", 0, "False urgency damages trust."], ["Send three follow-up emails in two days.", 0, "Pressure without value is noise."]], "'Think about it' hides a concern. Make it safe to name it."], ["Objections", "The buyer says, 'We tried a tool like yours before and it failed.' What do you do?", [["Ask what happened and what they would need to see differently this time.", 3, "You learn the failure pattern and show you are listening."], ["Say your product is nothing like theirs.", 1, "It dismisses their experience."], ["Skip it and carry on with the demo.", 0, "The unresolved fear will resurface."], ["Blame their previous vendor.", 1, "It could be unfair and reflects poorly on you."]], "Past failures set decision criteria. Mine them."], ["Objections", "'Your solution seems too complicated for our team.' What is the best response?", [["Ask which part feels complex, then show how onboarding and support handle it.", 3, "You diagnose and then address the specific concern."], ["Say it is simple once you get used to it.", 1, "It is dismissive and unspecific."], ["Cut features to simplify the offer.", 1, "You may weaken the deal without understanding the issue."], ["Tell them most customers figure it out.", 0, "It gives no evidence and no reassurance."]], "Respond to specifics with specifics: onboarding plans, references, timelines."], ["Objections", "The prospect says they need to run it by their boss, who has not been in any calls. What is the most effective step?", [["Offer to help prepare a short summary and ask if you can join a brief call with the boss.", 3, "You equip your contact and gain access."], ["Say you will wait until they have the answer.", 1, "You lose influence over the message."], ["Send a long product brochure to the boss.", 0, "Cold materials rarely persuade a decision maker."], ["Push them to sign today without the boss.", 0, "They cannot, and it burns trust."]], "Help your champion sell internally."], ["Objections", "The buyer says 'I'm happy with my current vendor.' Which reply keeps the door open?", [["Ask what they like most and what one thing they would improve if they could.", 3, "It validates and discovers a gap."], ["Say you can offer a better price.", 1, "It makes the conversation about price only."], ["Tell them vendor lock-in is risky.", 0, "It sounds like scare tactics."], ["End the call politely and never contact again.", 1, "You lose future opportunities."]], "Satisfaction is rarely absolute; ask about the one thing they would change."], ["Negotiation", "In the final stage, the buyer asks for a 25 percent discount. What do you do?", [["Ask what is driving the request, then trade concessions for something such as a longer term or faster signature.", 3, "Concessions should always be exchanged for value."], ["Agree to 25 percent to close the deal.", 0, "You give up margin and invite more demands."], ["Refuse flatly and walk away.", 1, "You may lose a good deal needlessly."], ["Offer 10 percent without asking for anything.", 1, "Free concessions teach them to push again."]], "Never concede without a trade."], ["Negotiation", "The buyer says they have another offer lower than yours. What is the best step?", [["Ask to understand the offer, then explain the differences in terms of outcome and risk.", 3, "You compete on value and clarity."], ["Immediately beat their price.", 0, "A race to the bottom."], ["Question whether the other offer even exists.", 0, "It sounds accusatory."], ["Tell them to take it if it is cheaper.", 1, "It may be honest but ends the discussion."]], "Treat competitive offers as information, not as a threat."], ["Negotiation", "You are about to name your price. What is the strongest way to do it?", [["State it with confidence, link it to the outcomes you agreed, then stay silent.", 3, "Confident framing and silence anchor value."], ["Apologise for the price and mention you might be able to adjust.", 0, "You signal that the price is soft."], ["Quickly list discounts before giving the price.", 1, "It makes the price sound inflated."], ["Email the price without context.", 1, "Without context, buyers compare on price alone."]], "Price follows value, and silence after the number is powerful."], ["Negotiation", "A procurement officer demands a lower price in exchange for 'future volume'. How do you respond?", [["Offer tiered pricing that unlocks lower rates when volume is actually reached.", 3, "The promise is turned into a contractual commitment."], ["Give the discount now and trust them.", 0, "Future volume often never arrives."], ["Refuse to discuss it.", 1, "It is rigid."], ["Ask your manager to decide and wait.", 1, "You lose control and time."]], "Tie concessions to commitments you can verify."], ["Negotiation", "At the last moment, the buyer adds new legal demands that delay signature. What is a good approach?", [["Ask which terms matter most, involve your legal team early, and propose a timeline.", 3, "It keeps the process moving and builds trust."], ["Accept every demand to avoid delay.", 1, "It may create risk for your company."], ["Reject them all.", 1, "You may lose the deal over addressable items."], ["Go quiet until they sign.", 0, "Silence is not a strategy."]], "Late-stage legal friction is normal. Manage the path, not just the paper."], ["Negotiation", "The buyer asks for your 'best and final price' on the first call. What is a good reply?", [["Explain that you want to understand their needs first so the price fits the scope.", 3, "It resists premature price-shopping."], ["Give a number to show confidence.", 1, "You have no value anchor yet."], ["Give a large discount to build rapport.", 0, "You devalue the product."], ["Refuse to talk price until they sign.", 1, "It sounds evasive."]], "Pricing before discovery is guessing."], ["Closing", "The buyer is positive but keeps delaying signature. What is the most constructive step?", [["Review the mutual action plan, ask what is still open, and agree a date for the next step.", 3, "It turns vague interest into a dated path."], ["Send a daily reminder email.", 0, "It adds pressure without value."], ["Offer a last-minute discount.", 1, "It rewards delay."], ["Assume they lost interest and close the deal as lost.", 1, "You may abandon a live deal."]], "Always leave a call with a dated, specific next step."], ["Closing", "You are on a call where the buyer says, 'This all sounds good.' What is the best question?", [["What would you need to see to move forward and who else needs to approve it?", 3, "It tests readiness and reveals process."], ["Great, so should I send the contract?", 1, "Too hasty if approvers and criteria are unclear."], ["Fantastic, do you want to sign today?", 1, "It may feel pushy."], ["Thank them and end the call.", 0, "You leave without a next step."]], "Positive tone is not commitment. Confirm criteria and next steps."], ["Prospecting", "You are writing a cold email to a head of operations you have never met. Which opening works best?", [["A one-line observation about their company followed by a relevant question.", 3, "Specific and brief earns attention."], ["A paragraph about your company's history and awards.", 0, "It centres on you rather than them."], ["'I hope this email finds you well, I would love 30 minutes of your time.'", 1, "Generic and gives no reason to reply."], ["A bold claim that you will double their revenue.", 0, "Unproven promises sound like spam."]], "Lead with relevance to them and ask one easy question."], ["Prospecting", "Your first cold call is answered by a gatekeeper who asks, 'What is this regarding?' What do you say?", [["Briefly state the reason, such as helping teams like theirs cut reporting time, and ask who owns that area.", 3, "It is honest and focused on an outcome."], ["Say it is a personal matter.", 0, "Deception destroys trust."], ["Say you would rather speak to the decision maker directly.", 1, "It sounds dismissive."], ["Hang up and call back later pretending to be a client.", 0, "Unethical and risky."]], "Treat gatekeepers as allies, not obstacles."], ["Prospecting", "A prospect has not replied to three emails. What is a good fourth touch?", [["Send a short note with a fresh, relevant insight or case study and an easy yes or no question.", 3, "It adds value and invites a low-effort reply."], ["Send the same email again with 'Just bumping this'.", 1, "No new value."], ["Send an angry email asking why they ignored you.", 0, "It burns the relationship."], ["Stop contacting them forever.", 1, "Persistence with value often works."]], "Each touch should give a reason to respond."], ["Prospecting", "At a conference, you meet someone from your target account. How do you start?", [["Ask what they are working on this year and listen.", 3, "Curiosity builds rapport."], ["Hand over a brochure and your card immediately.", 1, "It reads as transactional."], ["Pitch for ten minutes.", 0, "You lose attention."], ["Ask whether they are the budget holder.", 1, "Too early to qualify."]], "Be interested before being interesting."], ["Follow-up", "After a demo, the buyer goes quiet for two weeks. What is the best follow-up?", [["Reference something they said in the demo, share a relevant resource and propose a quick call.", 3, "It re-engages with relevance."], ["Say, 'Just checking in. Any update?'", 1, "Low value and easy to ignore."], ["Tell them the offer is expiring.", 0, "Artificial urgency damages trust."], ["Call their CEO.", 0, "Going over their head can end the deal."]], "Make follow-ups useful, not needy."], ["Follow-up", "You promised to send a proposal by Friday but it is not ready. What do you do?", [["Tell them proactively, give a new date, and keep it.", 3, "Reliability builds trust."], ["Send a rushed, incomplete proposal.", 1, "A poor first impression is worse than a short delay."], ["Say nothing and hope they forget.", 0, "Broken commitments are remembered."], ["Blame your team.", 0, "It sounds unprofessional."]], "Under-promise, over-deliver, and communicate early."], ["Follow-up", "A deal closed two months ago. What is the best way to keep the relationship strong?", [["Schedule a check-in on their results and share tips for getting more value.", 3, "It supports adoption and uncovers expansion."], ["Only contact them at renewal.", 0, "The relationship will fade."], ["Send marketing newsletters only.", 1, "Impersonal."], ["Ask for a referral in every email.", 1, "It becomes self-serving."]], "The best expansion starts with proven value."], ["Presenting", "Ten minutes into your demo you notice the buyer looking at their phone. What do you do?", [["Pause and ask which part is most relevant, then adapt to their priorities.", 3, "It re-engages by letting them steer."], ["Speed up and finish the full demo.", 1, "You lose them."], ["Ask them to put the phone away.", 0, "It is rude."], ["Continue as planned.", 1, "You ignore warning signs."]], "A demo is a conversation, not a broadcast."], ["Presenting", "You are asked a technical question you cannot answer in front of the client. What is best?", [["Say you will confirm the exact answer, note it down, and follow up the same day.", 3, "Honesty with a commitment builds credibility."], ["Make an educated guess.", 0, "A wrong answer can cost the deal."], ["Change the subject.", 1, "The client will notice."], ["Say it is not important.", 0, "You dismiss their concern."]], "Never bluff, and then keep the follow-up promise."], ["Presenting", "You have 15 minutes to pitch to a senior executive. How do you structure it?", [["Open with their problem and the outcome, show proof, and leave time for questions.", 3, "Executives want relevance and brevity."], ["Cover the company history, then every feature.", 0, "They will tune out."], ["Spend the time on a long demo.", 1, "Detail without context loses attention."], ["Read slides word for word.", 1, "It adds little."]], "Start with the 'so what'."], ["Customer success", "A customer calls angry about a failed delivery. Which first response is best?", [["Listen fully, acknowledge the impact, and state what you will do and by when.", 3, "Empathy plus ownership restores trust."], ["Explain that the delay was caused by the carrier.", 1, "It sounds defensive."], ["Offer a refund without hearing the issue.", 1, "You may miss the real problem."], ["Promise it will never happen again.", 0, "Overpromising creates new risk."]], "Handle the emotion, then the problem."], ["Customer success", "A long-term customer asks to cancel because of budget cuts. What do you do?", [["Ask about their priorities, explore a smaller plan or pause, and keep the door open.", 3, "You protect the relationship and revenue."], ["Process the cancellation immediately.", 1, "You skip a chance to help."], ["Threaten fees under the contract.", 0, "It destroys goodwill."], ["Offer 50 percent off forever.", 0, "You set a precedent that harms margin."]], "Retention starts with understanding their constraints."], ["Email", "Your email subject line should be:", [["Specific and short, such as 'Cutting month-end close time at Acme'.", 3, "Clarity and relevance drive opens."], ["ALL CAPS with exclamation marks.", 0, "It looks like spam."], ["'Quick question'.", 1, "Overused and vague."], ["A full paragraph.", 0, "Too long to read."]], "A subject line is a promise of relevance."], ["Email", "The best call to action at the end of a prospecting email is:", [["One clear, low-effort question, such as 'Is this a priority this quarter?'", 3, "A single easy ask raises replies."], ["Three different asks in one email.", 1, "It creates confusion."], ["'Let me know if you are interested.'", 1, "Vague and easy to ignore."], ["'Call me now'.", 0, "Pushy and unrealistic."]], "Make the next step easy and specific."], ["Ethics", "A customer asks whether your product can do something it cannot yet do. What should you say?", [["Be honest, explain current capabilities, and describe what is realistically on the roadmap, if anything.", 3, "Honesty protects reputation and avoids later disputes."], ["Say yes and hope engineering delivers.", 0, "It sets up a broken promise."], ["Say it is coming soon without knowing.", 0, "A false roadmap commitment."], ["Ignore the question.", 1, "Evasion erodes trust."]], "Sales success compounds on trust."], ["Ethics", "You discover an error in your favour on a customer's invoice. What do you do?", [["Tell the customer and correct it.", 3, "Integrity wins long-term loyalty."], ["Say nothing and keep the extra revenue.", 0, "It risks the relationship and reputation."], ["Wait to see if they notice.", 0, "Passive deception."], ["Offset it quietly on a future invoice without telling them.", 1, "Better than keeping it, but still lacks transparency."]], "Fix errors proactively."], ["Teamwork", "A colleague asks for help preparing a bid, but you are busy with your own deals. What is a good response?", [["Offer a short time block to review their approach and share templates.", 3, "Collaboration lifts the whole team."], ["Say no because quota is individual.", 1, "It weakens the team culture."], ["Take over their bid.", 1, "It undermines their ownership."], ["Ignore the message.", 0, "It damages trust."]], "Great teams share what works."], ["Territory", "Two reps want the same account. What is the best way to resolve it?", [["Discuss with both, check territory rules, and agree on roles with your manager if needed.", 3, "Transparent rules prevent conflict."], ["Contact the customer first to claim it.", 0, "It creates a poor experience."], ["Secretly reassign the contact to yourself.", 0, "It destroys trust."], ["Let the customer choose who they prefer.", 1, "It puts the customer in an awkward position."]], "Customers should never feel internal friction."], ["Mindset", "You lose a deal you expected to win. What is the best next step?", [["Ask the buyer for candid feedback and capture the lessons with your team.", 3, "Losses are data."], ["Blame the competitor's low price.", 1, "It prevents learning."], ["Ignore the loss and move on.", 1, "You miss the opportunity to improve."], ["Argue with the buyer about the decision.", 0, "It harms future chances."]], "Win-loss reviews improve everyone's results."]];

SCEN.push(...[["Global selling", "You are meeting a Japanese prospect for the first time and they offer their business card with both hands. What do you do?", [["Receive it with both hands, read it, place it respectfully on the table, and offer yours the same way.", 3, "It shows respect and attention."], ["Take it with one hand and put it in your back pocket.", 0, "Treating a card carelessly can be seen as disrespectful."], ["Write notes on the card to remember details.", 0, "Writing on a card can be seen as disrespectful."], ["Say you do not have cards and move on.", 1, "Preparation matters in many markets."]], "In many Asian business cultures the card represents the person. Handle it with care."], ["Global selling", "A German prospect arrives for your 9:00 call exactly on time and you are still dialling in at 9:04. What is the best response?", [["Apologise briefly, then move directly into a clear agenda and be precise about timing.", 3, "It respects their time-focused culture."], ["Joke about how flexible you are with time.", 0, "It can come across as unprofessional."], ["Spend ten minutes on small talk to rebuild rapport.", 1, "Many German professionals prefer to start with the substance."], ["Pretend nothing happened.", 1, "Silence about lateness looks careless."]], "Punctuality and structure signal reliability in many northern European markets."], ["Global selling", "In a first meeting in Saudi Arabia or the UAE, the host spends time on coffee and personal conversation before business. How do you respond?", [["Invest in the relationship, accept the hospitality and let the host lead into business.", 3, "Relationship building is the foundation of many deals."], ["Politely push to get to the agenda quickly.", 1, "It may feel dismissive."], ["Decline the coffee to save time.", 0, "Refusing hospitality can offend."], ["Check your phone while waiting.", 0, "It shows disrespect."]], "In many relationship-driven cultures, trust comes before transactions."], ["Global selling", "A Brazilian customer says 'We will try to make a decision soon' after a warm meeting. What does it mean and what do you do?", [["Treat it as interest but confirm next steps and ask who needs to be involved.", 3, "You keep momentum without assuming a firm commitment."], ["Assume the deal is closed.", 0, "Warm language does not always mean a decision."], ["Hound them with daily emails.", 0, "It could harm the relationship."], ["Drop the deal because it sounded vague.", 1, "You might lose a good opportunity."]], "Polite language can hide uncertainty. Always confirm specifics."], ["Global selling", "You are negotiating with a team in India. They ask for a discount repeatedly, even after you shared your final price. What is a good approach?", [["Explain the value, offer a package trade such as a longer term, and stay patient and friendly.", 3, "Negotiation is often expected, and patience builds trust."], ["End the call abruptly.", 0, "It signals disrespect."], ["Give the discount to avoid conflict.", 1, "You may set a precedent."], ["Insist that you never negotiate.", 1, "It may feel rigid."]], "In many markets haggling is a normal part of doing business. Trade, do not simply give."], ["Global selling", "You are presenting to a Dutch client who bluntly says, 'This is too expensive and not what we need.' How do you interpret it?", [["As direct honest feedback, so you thank them and ask what exactly they need.", 3, "Directness is usually not rudeness in the Netherlands."], ["As a personal insult.", 0, "It would damage the conversation."], ["As the end of the deal.", 1, "It is often an opening for discussion."], ["As a cue to get defensive.", 0, "It would escalate."]], "In low-context cultures people often say exactly what they mean."], ["Global selling", "A Chinese delegation has just agreed in principle to your terms, but the signing keeps slipping. What is a likely reason and a good response?", [["They may need internal consensus; ask about the approval process and offer to help.", 3, "Group decisions often require time and alignment."], ["Assume they are lying.", 0, "It damages trust."], ["Threaten to withdraw the offer.", 0, "It can lose face."], ["Send the contract to the CEO directly.", 1, "It can bypass the team and cause friction."]], "Understand how decisions get made and support your champion."], ["Global selling", "You are scheduling a call between teams in Singapore, Milan and Chicago. How do you plan fairly?", [["Offer a few options in UTC and local times and rotate the inconvenient slot.", 3, "It is considerate and avoids confusion."], ["Pick a time convenient for you only.", 0, "It disregards others."], ["Always use your own time zone without labels.", 1, "It causes mistakes."], ["Cancel the call.", 0, "It does not solve the problem."]], "Time zones are a daily courtesy in international teams."], ["Global selling", "In an email to a customer whose first language is not English, which style is best?", [["Short sentences, plain words, no idioms, with a clear summary and next step.", 3, "Clarity helps everyone and avoids misunderstanding."], ["Complex sentences with slang and sports metaphors.", 0, "Idioms confuse non-native speakers."], ["Very long paragraphs.", 1, "They are harder to read."], ["Only emojis.", 0, "They are unprofessional."]], "Write for the reader, not for yourself."], ["Global selling", "A French colleague proposes a long business lunch to discuss a partnership. What is the best approach?", [["Accept it and treat it as part of building the relationship, saving the main business talk for later.", 3, "Meals are often a chance to build trust."], ["Insist on a 20-minute call.", 1, "It might feel rushed."], ["Refuse because lunch is unproductive.", 0, "You could damage rapport."], ["Bring your laptop to work through the meal.", 0, "It is distracting."]], "Respect local rhythms of work and meals."], ["Global selling", "You are asked to translate your contract to Spanish for a customer in Mexico. What is the best practice?", [["Use a qualified professional translator and have a local expert review it.", 3, "Legal terms need accuracy."], ["Use a free online translator only.", 0, "It can create costly errors."], ["Send it only in English.", 1, "It may slow the process."], ["Ask the customer to translate it.", 0, "It is unprofessional."]], "Quality translation protects both parties."], ["Global selling", "A Korean client, after a successful meeting, invites you for dinner and drinks. How do you handle it?", [["Accept graciously, participate respectfully and avoid talking business heavily at the table.", 3, "Socialising is key to building trust."], ["Decline politely and head to your hotel.", 1, "You may miss an opportunity."], ["Insist on discussing pricing all evening.", 0, "It is poor etiquette."], ["Drink heavily to impress them.", 0, "It is risky and unprofessional."]], "Social events matter, but keep your judgment."], ["Global selling", "A prospect in Scandinavia seems quiet and does not push back on anything. What do you do?", [["Ask open questions and make space for their opinions, accepting silence as thinking time.", 3, "Silence can be a sign of respect or consideration."], ["Fill every silence with talking.", 1, "It may overwhelm them."], ["Assume they agree to everything.", 0, "Silence is not consent."], ["Press for an immediate commitment.", 0, "It can backfire."]], "Learn to read comfortable silence."], ["Global selling", "You are asked to bring a gift to a client in a country you are visiting. What should you do?", [["Ask a local colleague about customs, then choose something modest and appropriate.", 3, "Customs vary widely."], ["Bring an expensive gift to impress them.", 1, "It may be seen as a bribe."], ["Never give gifts anywhere.", 1, "It may be seen as cold in some cultures."], ["Bring alcohol without checking.", 0, "It may be offensive or illegal in some countries."]], "Always check local customs and your company's compliance policy."], ["Ethics", "A foreign official hints that your deal would go faster if a 'small facilitation payment' were made. What do you do?", [["Decline, document it, and report it to your compliance or legal team.", 3, "Bribery laws apply globally."], ["Pay it quietly since it is common locally.", 0, "It is illegal under many laws."], ["Ask a local agent to handle it without telling you.", 0, "You remain responsible."], ["Offer a gift instead.", 0, "It is still a bribe."]], "Integrity protects people, the company and the deal."]]);

function parseExpr(raw) {

  if (!s) throw new Error('Type an expression first');

    const cands = this.peers.filter(p => p.presence && p.presence.jt).sort((a, b) => (a.presence.jt - b.presence.jt) || (a.peer < b.peer ? -1 : 1));

  becomeHost() {

  publish(claim) {

  }

  step() {
    if (this.dead) return;

    if (!this.st && !this.creator && Date.now() - this.openedAt > 7000) { leaveTable('That table was not found or its host has left. Check the code and try again.'); return; }
    const sig = this.st ? this.st.v + '|' + this.st.pl.map(p => p[1] + p[2]).join() + '|' + this.presentIdx().join() + '|' + this.isHost : 'x';

  hostStep() {

      const keep = new Set(pres.map(p => p.peer)), before = st.pl.length;
      if (st.pl.some(p => !keep.has(p[0]))) { st.pl = st.pl.filter(p => keep.has(p[0])); st.sc = st.pl.map(() => 0); ch = true; }
    }
    for (const p of pres) {
      const i = st.pl.findIndex(x => x[0] === p.peer);
      const nm = String(p.presence.n).slice(0, 18), em = String(p.presence.e || '🙂').slice(0, 4);
      if (i < 0) { if (st.ph === 'lobby' || g.lateJoin) { st.pl.push([p.peer, nm, em]); st.sc.push(0); ch = true; } }
      else if (st.pl[i][1] !== nm || st.pl[i][2] !== em) { st.pl[i][1] = nm; st.pl[i][2] = em; ch = true; }
    }
    for (const p of pres) {
      if (p.sameTab) continue;
      const a = p.presence.a; if (!a || !a.q) continue;

    return ch;
  }

  engineTick() {
    const st = this.st, g = this.game; let ch = false;
    if (st.ph === 'lobby' || st.ph === 'end') return false;

      } else if (st.ph === 'rev' && el >= st.dur) {
        if (st.r >= st.R || st.fin) this.phase('end', 0); else this.nextRound();
        ch = true;
      }

    return ch;
  }
  nextRound() { const st = this.st, g = this.game; st.r++; st.d = g.newRound(st, this.presentIdx(), this); this.phase('play', g.playMs); }
  endRound() { const st = this.st, g = this.game; if (g.score) g.score(st, this.presentIdx(), this); this.phase('rev', g.revMs); }

  applyAction(i, a) {

        if (st.ph === 'play') { this.endRound(); return true; }
        if (st.ph === 'rev') { if (st.r >= st.R || st.fin) this.phase('end', 0); else this.nextRound(); return true; }
        return false;
      case 'again':
        if (st.ph !== 'end') return false;

        if (g.rematch) { g.rematch(st, this.presentIdx(), this); return true; }

        if (ok && g.rounds && g.allDone(st, this.presentIdx())) this.endRound();

      }
    }
  }
  send(a) {
    a.q = ++this.seq;
    if (this.isHost) {
      const i = this.myIdx();
      if (i >= 0 && this.applyAction(i, a)) this.publish();

  }
}

  for (let i = 0; i < 5; i++) { if (res[i] === 'c') continue; if (cnt[g[i]] > 0) { res[i] = 'p'; cnt[g[i]]--; } }
  return res;
}

/* live timers without a full re-render */
function tickBars() {
  const t = S.table; if (!t || !t.st || !t.st.dur) return;
  const rem = t.rem(), pct = Math.max(0, Math.min(100, rem / t.st.dur * 100));

}
setInterval(() => { tickBars(); tickClocks(); }, 100);

/* ================= boot ================= */
(async function boot() {
  await Net.init();
  Net.root.onPeers(c => {
    S.lobbyPeers = c.peers.filter(p => p.kind !== 'agent');
    if (!S.table) { const sig = JSON.stringify(S.lobbyPeers.map(p => [p.peer, p.presence && p.presence.n, p.presence && p.presence.e, p.presence && p.presence.tb, p.presence && p.presence.ts])); if (sig !== lobbySig) { lobbySig = sig; scheduleRender(); } }
  });
  if (Net.root.onConnection) Net.root.onConnection(() => { lobbySig = ''; scheduleRender(); });
  lobbyPresence();
  fetchBoard('wordle'); fetchBoard('facts');
  render();
  setInterval(() => { if (S.table || Net.mode !== 'live') return; if (S.screen === 'wordle') fetchBoard('wordle'); else if (S.screen === 'facts') fetchBoard('facts'); else { fetchBoard('wordle'); fetchBoard('facts'); } }, 10000);
  const m = /^#table-([a-z0-9]{3,8})$/.exec(location.hash);
