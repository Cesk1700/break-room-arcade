<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break Room Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column. Lobby = title tiles, who is online, open tables, game shelf.
   Table = code strip, game board, scoreboard. One committed dark world, no light variant. */
:root{
  --ink:#f3f4f7; --panel:#ffffff; --panel2:#eceef3; --well:#e3e6ed; --line:#d2d6df; --text:#1a1e29; --mute:#5b6376;
  --accent:#1f3a5f; --accent-dk:#12253f;
  --coin:#b9810c; --pink:#c2415f; --teal:#1b8f7e; --blue:#3566c9; --violet:#7157bf; --orange:#c75f24;
  --good:#1e8a50; --bad:#c23b3b; --goodbg:#e2f3e9; --badbg:#fbe6e6;
  --display:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:16px/1.45 var(--body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
button,input{font-family:var(--body)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:22px;width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.mute{color:var(--mute)}
.small{font-size:14px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}

/* brand */
.brand{display:flex;flex-direction:column;gap:10px}
h1.title{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tiles{display:none}
.tile{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,68px);line-height:1;width:1.08em;height:1.22em;display:grid;place-items:center;
  border-radius:12px;color:#fff;box-shadow:none;transform:rotate(var(--r,0deg));background:var(--c)}
.tag{max-width:46ch;color:var(--mute);font-size:17px}

/* controls */
.btn{font:700 16px var(--body);border:0;border-radius:12px;padding:12px 18px;background:var(--accent);color:#fff;cursor:pointer;
  box-shadow:0 2px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s;min-height:46px}
.btn:hover:not(:disabled){background:var(--accent-dk)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.small{min-height:38px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input:not([type]){font:600 18px var(--body);background:#fff;color:var(--text);border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0}
input::placeholder{color:#8a91a5}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px}
.err{background:var(--badbg);border:1px solid var(--bad);color:#7a1f1f;border-radius:12px;padding:10px 14px}
.note{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--mute);font-size:14px}

/* profile */
.avatars{display:flex;gap:6px;flex-wrap:wrap}
.avpick{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--well);font-size:24px;cursor:pointer;display:grid;place-items:center}
.avpick[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
.av{font-size:20px;width:34px;height:34px;display:inline-grid;place-items:center;background:var(--well);border-radius:10px;flex:none}

/* lobby */
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;gap:8px;align-items:center;padding:4px 12px 4px 4px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:15px}
.person small{color:var(--mute);font-weight:500}
.tables{display:flex;flex-direction:column;gap:10px}
.tbl{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--panel2);border-left:8px solid var(--c,var(--line));flex-wrap:wrap}
.code{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:22px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.game{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.gico{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;box-shadow:none;flex:none}
.gico svg{width:34px;height:34px}
.game h3{font-size:24px;line-height:1.1}
.meta{font-size:13px;color:var(--mute);font-weight:600}
.joinrow{display:flex;gap:10px;flex-wrap:wrap}
.joinrow input{width:9em;text-transform:uppercase;letter-spacing:.14em}

/* table */
.thead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.board{background:var(--panel);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.rhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rn{font-weight:700}
.cat{padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);font-size:13px;font-weight:700}
.secs{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.secs b{font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--well);overflow:hidden;flex:1 0 100%}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.q{font-size:clamp(22px,4vw,32px);line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:600 17px var(--body);color:var(--text);padding:14px;border-radius:14px;
  border:2px solid var(--line);background:var(--panel2);cursor:pointer;min-height:64px;transition:border-color .1s,background .1s}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt .ltr{width:32px;height:32px;border-radius:9px;background:var(--well);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.opt.sel{border-color:var(--c);background:var(--panel2)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.answers{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 4px;border-radius:99px;background:var(--panel2);font-size:14px;font-weight:600}
.pill.ok{background:var(--goodbg)}
.pill .d{color:var(--good);font-weight:700}
.pill .z{color:var(--mute)}
.bigin{display:flex;gap:10px;flex-wrap:wrap}
.bigin input{flex:1 1 180px;font-size:22px}
.nums{display:flex;gap:12px;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:800;font-size:clamp(38px,9vw,64px);width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:16px;background:var(--c);color:#fff;box-shadow:none}
.ltrs{display:flex;gap:8px;flex-wrap:wrap}
.ltr2{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,40px);width:1.3em;height:1.5em;display:grid;place-items:center;border-radius:12px;background:var(--c);color:#fff;box-shadow:none}
.ops{display:flex;gap:8px;flex-wrap:wrap}
.ops button{font:800 20px var(--display);width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.live{min-height:1.5em;font-weight:600}
.live.bad{color:var(--bad)}
.live.good{color:var(--good)}
.reveal{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2)}
.li .r{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.li .pos{color:var(--good)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{padding:12px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.wcard b{font-family:var(--display);font-size:24px;overflow-wrap:anywhere}
.wcard.match{border-color:var(--good);background:var(--goodbg)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{padding:2px 10px;border-radius:99px;background:var(--panel2);font-size:13px;color:var(--mute)}
.melded{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,56px);color:var(--good)}

/* scoreboard */
.sb{display:flex;flex-direction:column;gap:8px}
.sbrow{display:grid;grid-template-columns:34px minmax(60px,150px) 1fr 70px;gap:10px;align-items:center}
.sbrow.gone{opacity:.45}
.sbrow.me .nm{color:var(--accent)}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{height:10px;background:var(--well);border-radius:6px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--c);transition:width .4s}
.pts{text-align:right;font-variant-numeric:tabular-nums}

/* podium */
.podium{display:flex;flex-direction:column;gap:10px}
.pod{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--panel2);border-left:10px solid var(--line)}
.pod.p1{border-left-color:var(--coin);background:#fbf3df}
.pod.p2{border-left-color:#9aa1b5}
.pod.p3{border-left-color:#d9895a}
.pod .place{font-family:var(--display);font-weight:800;font-size:34px;width:1.2em;text-align:center}
.pod .pn{font-weight:700;font-size:20px}
.pod .ps{margin-left:auto;font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}

/* connect four */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#2f5fb3;padding:10px;border-radius:14px;width:min(100%,520px);margin:0 auto}
.col{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.col:disabled{cursor:default}
.col:hover:not(:disabled){background:rgba(255,255,255,.2)}
.cell{aspect-ratio:1;border-radius:50%;background:#e9ecf3;box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.cell.R{background:#d6455d}
.cell.Y{background:#f2b705}
.cell.win{outline:4px solid #fff;outline-offset:-4px}
.cell.last{box-shadow:inset 0 0 0 4px rgba(0,0,0,.35)}
.seat{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:700}
.seat.turn{border-color:var(--accent)}
.seat i{width:18px;height:18px;border-radius:50%;display:inline-block}

@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  .sbrow{grid-template-columns:34px minmax(40px,90px) 1fr 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== calm professional theme ===== */
:root{
  --ink:#f1f4f3; --panel:#ffffff; --panel2:#eaf0ef; --well:#dde5e3; --line:#cdd8d5; --text:#1d2b2f; --mute:#566a6e;
  --accent:#2f6f6a; --accent-dk:#245853;
  --coin:#a07c3b; --pink:#a5604a; --teal:#4f8a73; --blue:#4f6d9a; --violet:#7d6591; --orange:#a5704a;
  --good:#2e7d5b; --bad:#b04a4a; --goodbg:#e2f1e9; --badbg:#f6e3e1;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 4px 14px rgba(20,40,40,.05);
}
h1,h2,h3{font-weight:400;letter-spacing:0}
h1.title{font-size:clamp(40px,7vw,58px);line-height:1.05}
h2{font-size:28px;line-height:1.15}
.game h3,.dcard h3{font-size:25px;line-height:1.1}
.tag{font-size:17px}
.card,.game,.board,.dcard{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}
.game::before{display:none}
.board{border-top:1px solid var(--line)}
.btn{border-radius:10px;box-shadow:none;font-weight:600}
.btn:active:not(:disabled){transform:none;background:var(--accent-dk)}
.btn.ghost{box-shadow:none}
.gico{width:44px;height:44px;border-radius:12px;font-size:19px;font-family:var(--body);font-weight:700}
.gico svg{width:26px;height:26px}
.kicker{font-size:12px;letter-spacing:.1em}
.q{font-size:clamp(24px,4.2vw,34px);line-height:1.2}
.secs,.rn,.pod .place,.pod .ps,.reveal,.melded{font-family:var(--body)}
.reveal,.melded{font-weight:700}
.tbl{border-left-width:6px}
.group{display:flex;flex-direction:column;gap:12px}
.group > h3{font-family:var(--body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dcard{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:12px}
.dstatus{font-weight:600}
.lb{display:flex;flex-direction:column;gap:6px}
.lbr{display:grid;grid-template-columns:26px 34px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--panel2)}
.lbr.me{background:#d9ebe8;font-weight:700}
.lbn{font-weight:700;color:var(--mute);text-align:center}
.lbname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbres{font-variant-numeric:tabular-nums;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.wgrid{display:flex;flex-direction:column;gap:6px;align-items:center}
.wrow{display:grid;grid-template-columns:repeat(5,56px);gap:6px}
.wc{height:56px;border:2px solid var(--line);display:grid;place-items:center;font:700 26px var(--body);background:#fff;border-radius:6px}
.wc.f{border-color:#8a9a9d}
.wc.c{background:#4d8a65;border-color:#4d8a65;color:#fff}
.wc.p{background:#b8902f;border-color:#b8902f;color:#fff}
.wc.a{background:#79868c;border-color:#79868c;color:#fff}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kbr{display:flex;gap:5px;justify-content:center;width:100%}
.key{flex:1 1 0;max-width:42px;height:48px;border-radius:6px;border:0;background:var(--well);color:var(--text);font:700 14px var(--body);cursor:pointer}
.key.wide{max-width:64px;flex:1.6 1 0}
.key.c{background:#4d8a65;color:#fff}.key.p{background:#b8902f;color:#fff}.key.a{background:#79868c;color:#fff}
.flagimg{height:190px;max-width:100%;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;align-self:center}
.flagemoji{font-size:110px;line-height:1;align-self:center}
.review{display:flex;flex-direction:column;gap:8px}
.rv{padding:10px 12px;border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.rv.ok{border-left:5px solid var(--good)}.rv.no{border-left:5px solid var(--bad)}
.wdots{display:flex;gap:5px;align-items:center}
.wdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:#fff;display:inline-block}
.wdots i.on{border-color:transparent;background:var(--c)}
@media (max-width:420px){.wrow{grid-template-columns:repeat(5,48px)}.wc{height:48px;font-size:22px}}
.game .btn{margin-top:auto}
.game{height:100%}
</style>
</head>

function makeLocalRoom(name) {

    peers: () => snap,

};

function podium(ctx) {
  const { st } = ctx, g = GAMES[st.g], order = st.pl.map((_, i) => i).sort((a, b) => st.sc[b] - st.sc[a]);
  const coop = st.g === 'meld';
  return h('div', { class: 'stack' },
    h('div', { class: 'row' }, h('h2', null, coop ? (st.fin ? 'You melded in ' + st.r + (st.r === 1 ? ' round' : ' rounds') : 'No meld this time') : 'Final scores')),
    h('div', { class: 'podium' }, order.map((i, k) => h('div', { class: 'pod p' + Math.min(k + 1, 4) }, h('span', { class: 'place' }, coop ? '' : k + 1), h('span', { class: 'av' }, st.pl[i][2]), h('span', { class: 'pn' }, st.pl[i][1] + (i === ctx.me ? ' (you)' : '')), h('span', { class: 'ps' }, fmt(st.sc[i]))))));
}

function viewTable(t) {
  const st = t.st;
  const head = h('div', { class: 'thead' }, h('span', { class: 'chip' }, 'Table ', h('span', { class: 'code' }, t.code.toUpperCase())),
    st ? h('span', { class: 'chip', style: { color: GAMES[st.g].color } }, GAMES[st.g].name) : null, h('span', { class: 'grow' }),
    h('button', { class: 'btn ghost small', onclick: () => leaveTable() }, 'Leave table'));
  if (!st) return h('div', { class: 'view' }, head, h('p', { class: 'mute' }, 'Joining table ' + t.code.toUpperCase() + '…'));
  const g = GAMES[st.g];
  const ctx = { t, st, d: st.d || {}, me: t.myIdx(), here: new Set(t.presentIdx()), act: t.presentIdx(), isHost: t.isHost, send: a => t.send(a), rem: () => t.rem() };
  let main;
  if (st.ph === 'lobby') {
    const n = ctx.act.length, ok = n >= g.min;
    main = h('div', { class: 'stack' },
      h('div', { class: 'row' }, gicon(g), h('div', null, h('h2', null, g.name), h('div', { class: 'meta' }, g.mode + ' · ' + g.time))),
      h('p', null, g.rules),
      h('div', { class: 'people' }, ctx.act.map(i => h('span', { class: 'person' }, h('span', { class: 'av' }, st.pl[i][2]), st.pl[i][1], i === ctx.me ? h('small', null, 'you') : null))),
      t.isHost ? h('div', { class: 'row' }, h('button', { class: 'btn', disabled: !ok, onclick: () => ctx.send({ t: 'start' }) }, 'Start game'), ok ? null : h('span', { class: 'mute' }, 'Needs at least ' + g.min + ' players.'))
        : h('p', { class: 'mute' }, 'Waiting for ' + (t.hostName() || 'the host') + ' to start.'),
      h('p', { class: 'small mute' }, 'Colleagues can join from the lobby, or by entering code ' + t.code.toUpperCase() + '.'));
  } else if (st.ph === 'end' && !g.custom) {
    main = h('div', { class: 'stack' }, podium(ctx), endBar(ctx));
  } else {
    main = h('div', { class: 'stack' }, VIEW[st.g](ctx),
      ctx.me < 0 ? h('p', { class: 'note' }, 'You are watching this round. You will be dealt in at the next one.') : null,
      st.ph === 'end' ? endBar(ctx) : null);
  }
  return h('div', { class: 'view' }, head,
    h('section', { class: 'board', style: { '--c': g.color } }, main),
    st.ph !== 'lobby' ? h('section', { class: 'card stack' }, h('div', { class: 'kicker' }, g.custom ? 'Wins' : 'Scores'), scoreboard(ctx)) : null);
}
function endBar(ctx) {
  const { st } = ctx, g = GAMES[st.g], can = ctx.isHost || (g.seatOK && ctx.me >= 0 && g.seatOK(st, ctx.me));
  return h('div', { class: 'row' }, can ? h('button', { class: 'btn', onclick: () => ctx.send({ t: 'again' }) }, g.custom ? 'Rematch, swap colours' : 'Play again') : h('span', { class: 'mute' }, 'Waiting for the host.'),
    ctx.isHost ? h('button', { class: 'btn ghost', onclick: () => ctx.send({ t: 'lobby' }) }, 'Back to table lobby') : null);
}

/* live timers without a full re-render */
function tickBars() {
  const t = S.table; if (!t || !t.st || !t.st.dur) return;
  const rem = t.rem(), pct = Math.max(0, Math.min(100, rem / t.st.dur * 100));
  document.querySelectorAll('[data-bar]').forEach(el => { el.style.width = pct + '%'; });
  document.querySelectorAll('[data-sec]').forEach(el => { el.textContent = Math.ceil(rem / 1000); });
  document.querySelectorAll('[data-hint]').forEach(el => { el.hidden = rem > t.st.dur / 2; });
}
setInterval(() => { tickBars(); tickClocks(); }, 100);

/* ================= boot ================= */
(async function boot() {
  await Net.init();
  Net.root.onPeers(c => {
    S.lobbyPeers = c.peers.filter(p => p.kind !== 'agent');
    if (!S.table) { const sig = JSON.stringify(S.lobbyPeers.map(p => [p.peer, p.presence && p.presence.n, p.presence && p.presence.e, p.presence && p.presence.tb, p.presence && p.presence.ts])); if (sig !== lobbySig) { lobbySig = sig; scheduleRender(); } }
  });
  if (Net.root.onConnection) Net.root.onConnection(() => { lobbySig = ''; scheduleRender(); });
  lobbyPresence();
  fetchBoard('wordle'); fetchBoard('facts');
  render();
  setInterval(() => { if (S.table || Net.mode !== 'live') return; if (S.screen === 'wordle') fetchBoard('wordle'); else if (S.screen === 'facts') fetchBoard('facts'); else { fetchBoard('wordle'); fetchBoard('facts'); } }, 10000);
  const m = /^#table-([a-z0-9]{3,8})$/.exec(location.hash);
  if (m && S.name) joinCode(m[1]);
})();
})();
</script>
